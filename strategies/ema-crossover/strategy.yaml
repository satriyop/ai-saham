version: 1
name: "EMA Crossover"
description: |
  Classic fast/slow EMA crossover strategy.
  Fast EMA(9) crossing above slow EMA(21) signals uptrend momentum.
  RSI filter prevents entering at overbought levels.

  Entry: EMA(9) > EMA(21) with RSI < 65 (not yet overbought).
  Exit: EMA(9) < EMA(21) (trend reversal) or RSI overbought.

  Simple, fast-responding, good as a baseline trend-following strategy.
  Minimum data: 21 candles (slow EMA warmup).

indicators:
  fast_ema:
    type: EMA
    period: 9
  slow_ema:
    type: EMA
    period: 21
  rsi:
    type: RSI
    period: 14

default_outcome: MODERATE

signal_mapping:
  LOW_RISK: ENTER_LONG
  MODERATE: HOLD
  HIGH_RISK: EXIT_LONG

rules:
  - name: ema_bullish_cross
    priority: 10
    when:
      all:
        - left:
            indicator: fast_ema
          operator: ">"
          right:
            indicator: slow_ema
        - indicator: rsi
          operator: "<"
          value: 65
    outcome: LOW_RISK
    rationale: "EMA(9) above EMA(21) with RSI below 65 — uptrend confirmed, not overbought"

  - name: ema_bearish_cross
    priority: 10
    when:
      left:
        indicator: fast_ema
      operator: "<"
      right:
        indicator: slow_ema
    outcome: HIGH_RISK
    rationale: "EMA(9) crossed below EMA(21) — downtrend signal, exit"

  - name: rsi_overbought_exit
    priority: 20
    when:
      indicator: rsi
      operator: ">"
      value: 75
    outcome: HIGH_RISK
    rationale: "RSI overbought — exit before reversal"
