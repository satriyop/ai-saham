version: 1
name: "Volume Spike + Momentum"
description: |
  Enters when an abnormal volume spike (2x+ normal) coincides with
  bullish MACD momentum. Volume spikes on IDX reliably signal
  institutional activity — pairing with MACD filters false spikes.

  Entry: vol_ratio > 2.0 + MACD bullish cross + RSI not overbought.
  Exit:  MACD bearish cross (momentum failed).

  Minimum data: 26 candles (MACD) + 20 (VOLUME_RATIO avg window).

indicators:
  vol_ratio:
    type: VOLUME_RATIO
    period: 20
  macd:
    type: MACD
    period: 12
  macd_signal:
    type: MACD_SIGNAL
    period: 9
  rsi:
    type: RSI
    period: 14

default_outcome: MODERATE

signal_mapping:
  LOW_RISK: ENTER_LONG
  MODERATE: HOLD
  HIGH_RISK: EXIT_LONG

rules:
  - name: volume_spike_with_momentum
    priority: 10
    when:
      all:
        - left:
            indicator: vol_ratio
          operator: ">"
          right:
            value: 2.0
        - left:
            indicator: macd
          operator: ">"
          right:
            indicator: macd_signal
        - indicator: rsi
          operator: "<"
          value: 65
    outcome: LOW_RISK
    rationale: "Volume spike >2x average with MACD bullish cross — institutional activity with momentum"

  - name: momentum_reversal_exit
    priority: 10
    when:
      left:
        indicator: macd
      operator: "<"
      right:
        indicator: macd_signal
    outcome: HIGH_RISK
    rationale: "MACD bearish cross — momentum exhausted, exit"

  - name: overbought_exit
    priority: 20
    when:
      indicator: rsi
      operator: ">"
      value: 75
    outcome: HIGH_RISK
    rationale: "RSI overbought — take profit before reversal"
