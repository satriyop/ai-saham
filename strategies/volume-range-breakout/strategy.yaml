version: 1
name: "Range Volume Breakout"
description: |
  Classic price channel breakout strategy supported by volume expansion.
  Enters when the close price breaks above the 20-period Donchian Upper Band
  coinciding with a 2x+ volume spike and healthy RSI.
  
  Exit: Close price crosses below the Donchian Middle Band or RSI extremely overbought.
  Minimum data: 21 candles (Donchian Channel lookup) + 20 candles (VOLUME_RATIO warmup).

indicators:
  donchian_upper:
    type: DONCHIAN_UPPER
    period: 20
  donchian_middle:
    type: DONCHIAN_MIDDLE
    period: 20
  vol_ratio:
    type: VOLUME_RATIO
    period: 20
  rsi:
    type: RSI
    period: 14

default_outcome: MODERATE

signal_mapping:
  LOW_RISK: ENTER_LONG
  MODERATE: HOLD
  HIGH_RISK: EXIT_LONG

rules:
  # Entry Rule: Donchian Channel breakout supported by 2x volume spike
  - name: range_volume_breakout
    priority: 10
    when:
      all:
        - left:
            indicator: CLOSE
          operator: ">"
          right:
            indicator: donchian_upper
        - left:
            indicator: vol_ratio
          operator: ">"
          right:
            value: 2.0
        - left:
            indicator: rsi
          operator: "<"
          right:
            value: 70
    outcome: LOW_RISK
    rationale: "Price broke above 20-day high (Donchian Upper) with volume spike >2x and RSI < 70"

  # Exit Rule: Close crosses below middle band
  - name: donchian_middle_exit
    priority: 10
    when:
      left:
        indicator: CLOSE
      operator: "<"
      right:
        indicator: donchian_middle
    outcome: HIGH_RISK
    rationale: "Price crossed below the Donchian Middle Band — trend weakness, exit position"

  # Exit Rule: RSI overbought extreme
  - name: rsi_exhaustion_exit
    priority: 20
    when:
      left:
        indicator: rsi
      operator: ">"
      right:
        value: 80
    outcome: HIGH_RISK
    rationale: "RSI > 80 indicates extreme buying climax — take profit"
