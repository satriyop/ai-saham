version: 1
name: "RSI Momentum"
description: |
  Momentum strategy combining RSI extremes with SMA trend filter.
  Enters on RSI oversold when price is above SMA (uptrend dip-buy).
  Exits on RSI overbought or trend breakdown.

indicators:
  sma_50:
    type: SMA
    period: 50
  rsi:
    type: RSI
    period: 14

default_outcome: MODERATE

signal_mapping:
  LOW_RISK: ENTER_LONG
  MODERATE: HOLD
  HIGH_RISK: EXIT_LONG

rules:
  - name: oversold_uptrend
    priority: 10
    when:
      all:
        - indicator: rsi
          operator: "<"
          value: 30
        - left:
            indicator: CLOSE
          operator: ">"
          right:
            indicator: sma_50
    outcome: LOW_RISK
    rationale: "RSI oversold while price above SMA50 - uptrend dip buy"

  - name: overbought_exit
    priority: 10
    when:
      indicator: rsi
      operator: ">"
      value: 75
    outcome: HIGH_RISK
    rationale: "RSI overbought - take profit"

  - name: trend_breakdown
    priority: 20
    when:
      all:
        - left:
            indicator: CLOSE
          operator: "<"
          right:
            indicator: sma_50
        - indicator: rsi
          operator: "<"
          value: 45
    outcome: HIGH_RISK
    rationale: "Price below SMA50 with weakening RSI - trend broken"
