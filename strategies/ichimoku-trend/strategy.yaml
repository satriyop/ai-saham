version: 1
name: "Ichimoku Trend"
description: |
  Classic Ichimoku Kinko Hyo trend-following strategy.
  LOW_RISK: price above cloud + tenkan > kijun + price rising over 26 days.
  HIGH_RISK: price below cloud, or tenkan/kijun cross with price under base line.
  MODERATE: mixed or inside cloud.

  Minimum data required: 78 trading days (SpanB warmup).
  Standard settings: Tenkan-9, Kijun-26, Span A-26 displaced, Span B-52 displaced.

indicators:
  tenkan:
    type: ICHIMOKU_TENKAN
    period: 9
  kijun:
    type: ICHIMOKU_KIJUN
    period: 26
  span_a:
    type: ICHIMOKU_SPAN_A
    period: 26
  span_b:
    type: ICHIMOKU_SPAN_B
    period: 52
  chikou:
    type: ICHIMOKU_CHIKOU
    period: 26

default_outcome: MODERATE

signal_mapping:
  LOW_RISK: ENTER_LONG
  MODERATE: HOLD
  HIGH_RISK: EXIT_LONG

rules:
  - name: strong_bullish_all_signals
    priority: 10
    when:
      all:
        - left:
            indicator: CLOSE
          operator: ">"
          right:
            indicator: span_a
        - left:
            indicator: CLOSE
          operator: ">"
          right:
            indicator: span_b
        - left:
            indicator: tenkan
          operator: ">"
          right:
            indicator: kijun
        - left:
            indicator: CLOSE
          operator: ">"
          right:
            indicator: chikou
    outcome: LOW_RISK
    rationale: "Price above cloud, tenkan > kijun, close > 26-day-ago close — full bullish alignment"

  - name: bearish_below_cloud
    priority: 10
    when:
      all:
        - left:
            indicator: CLOSE
          operator: "<"
          right:
            indicator: span_a
        - left:
            indicator: CLOSE
          operator: "<"
          right:
            indicator: span_b
    outcome: HIGH_RISK
    rationale: "Price below cloud — bearish Ichimoku structure"

  - name: bearish_tenkan_cross
    priority: 20
    when:
      all:
        - left:
            indicator: tenkan
          operator: "<"
          right:
            indicator: kijun
        - left:
            indicator: CLOSE
          operator: "<"
          right:
            indicator: kijun
    outcome: HIGH_RISK
    rationale: "Tenkan crossed below kijun with price below base line"
