version: 1
name: "Ichimoku + MACD"
description: |
  Cloud direction (Ichimoku) + momentum confirmation (MACD).
  Two independent signal types must agree before entry.

  Ichimoku cloud: macro trend context (price above green cloud).
  MACD crossover: near-term momentum trigger.

  Entry: price above green cloud AND MACD bullish cross.
  Exit: MACD bearish cross (fast momentum exit) or price below Kijun (trend break).

  Minimum data: 78 candles (SpanB warmup).

indicators:
  span_a:
    type: ICHIMOKU_SPAN_A
    period: 26
  span_b:
    type: ICHIMOKU_SPAN_B
    period: 52
  kijun:
    type: ICHIMOKU_KIJUN
    period: 26
  macd:
    type: MACD
    period: 12
  macd_signal:
    type: MACD_SIGNAL
    period: 9

default_outcome: MODERATE

signal_mapping:
  LOW_RISK: ENTER_LONG
  MODERATE: HOLD
  HIGH_RISK: EXIT_LONG

rules:
  - name: cloud_bullish_macd_cross
    priority: 10
    when:
      all:
        - left:
            indicator: CLOSE
          operator: ">"
          right:
            indicator: span_a
        - left:
            indicator: CLOSE
          operator: ">"
          right:
            indicator: span_b
        - left:
            indicator: span_a
          operator: ">"
          right:
            indicator: span_b
        - left:
            indicator: macd
          operator: ">"
          right:
            indicator: macd_signal
    outcome: LOW_RISK
    rationale: "Price above green cloud with MACD bullish cross — trend and momentum aligned"

  - name: macd_bearish_exit
    priority: 10
    when:
      left:
        indicator: macd
      operator: "<"
      right:
        indicator: macd_signal
    outcome: HIGH_RISK
    rationale: "MACD crossed below signal — momentum reversed, exit"

  - name: kijun_break_exit
    priority: 20
    when:
      left:
        indicator: CLOSE
      operator: "<"
      right:
        indicator: kijun
    outcome: HIGH_RISK
    rationale: "Price broke below Kijun (base line) — trend structure broken"
