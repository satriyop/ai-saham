version: 1
name: "pre-open-screener"
description: |
  Pre-open market screener policy for IDX stocks.

  Screens for high-IEV movers before market open, computes entry range and
  ATR-based stop-loss, and can run optional AI research per candidate.

  Entry model: conditional range based on yesterday's close (not bid+tick).
  IDX 08:45-09:00 is a call auction; enter at open only if price is within range.

  Requires: Stockbit authenticated browser session for autonomous mode.
  AI research is optional and only runs when --with-ai is passed.
  Mode: deterministic by default, AI-assisted when explicitly enabled.

mode: deterministic

filters:
  # Tickers matching this regex suffix are excluded from the pipeline.
  # IDX warrants end in -W, rights/HMETD in -R, bonds in -L.
  exclude_suffix_pattern: '-(W|R|L)$'

  # Minimum trading days of history required for ATR/RSI to be meaningful.
  # New IPOs often hit ARA/ARB limits (35%) — indicators are meaningless on them.
  min_history_days: 20

screener:
  iev_min: 100000        # Minimum IEV to qualify
  top_n: 5               # Process only top N by IEV (reduces run time)
  fast_mode: false       # true = skip order book fetches

entry:
  capital: 3000000       # Entry position size in IDR (Rp 3,000,000)
  tick_above: 1          # Legacy: ticks above best bid (kept for reference)
  max_gap_pct: 0.03      # Fallback band when ATR range is unavailable
  suggested_limit_pct: 0.005  # Suggested limit = prev_close * (1 + this)

risk:
  stop_loss_pct: 0.20    # Legacy fallback when use_atr_stop is false
  use_atr_stop: true     # true = ATR-based stop; false = legacy fixed %
  atr_multiplier: 1.0    # Stop = entry - (multiplier * ATR)
  max_stop_pct: 0.07     # Hard cap: stop never more than 7% below entry

  # Tick-friction gate: IDX round-trip cost is ~0.41–0.65% incl. 0.10% PPh on sell.
  # 3 ticks at the relevant price tier typically covers this cost.
  # Set tick_friction_gate: false to disable.
  tick_friction_gate: true
  min_target_ticks: 3    # Implied 1:1 target must be >= this many ticks above entry
  min_stop_ticks: 2      # Stop must be >= this many ticks below entry

analysis:
  sma_period: 20         # SMA period (optional context, fast-mode fallback)
  rsi_period: 14         # RSI period for overbought gate
  atr_period: 14         # ATR period for stop sizing and range scaling
  rsi_overbought_threshold: 75  # RSI > this -> BEARISH (skip long)
  days: 365              # Days of historical data to load
  use_atr_range: true          # scale entry band by ATR instead of fixed %
  atr_range_cap_min: 0.01      # floor: never narrower than 1%
  atr_range_cap_max: 0.05      # ceiling: never wider than 5%
  accum_window_days: 7         # lookback for accumulation backing check
  accum_backed_threshold: 50   # score >= this -> BACKED
  fvwap_period: 20             # rolling window for Foreign VWAP

  # IEV intensity: compares mover IEV to the stock's own average 5-min volume.
  # High intensity = unusual interest (not necessarily manipulation — BEI July 2024
  # confirmed IEV is harder to manipulate than bid-offer thickness).
  # Formula: IEV / (avg_daily_volume_20d / 78)  [78 = 5-min bars per IDX trading day]
  iev_intensity_enabled: true
  iev_intensity_unusual_threshold: 5.0   # flag as UNUSUAL_VOLUME above this
  iev_intensity_auto_downgrade: false    # if true, UNUSUAL_VOLUME candidates → WATCH

regime_gate:
  # When market regime is in this list, tighten intraday entry rules.
  # IHSG Big Four (BBCA/BBRI/BMRI/BBNI) dominate index weight — when index opens
  # down sharply, second-liner bids evaporate regardless of individual signals.
  tighten_in_regimes: ["WEAK", "RISK_OFF"]

  # max_gap_pct is scaled by this factor in tighten_in_regimes.
  # 0.5 = halve the entry band (e.g., ±3% → ±1.5%).
  gap_pct_tightening_factor: 0.5

  # If true, reject UNCONFIRMED or None accumulation tags in tighten_in_regimes.
  # Only BACKED candidates proceed in weak market conditions.
  require_backed_in_weak: true

  # Set to false to disable regime gating entirely.
  regime_gate_enabled: true

journal:
  path: "journals/pre-open.csv"  # Paper trade log path
