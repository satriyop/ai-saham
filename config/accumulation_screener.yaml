version: 1

accumulation_screener:
  screener:
    # Market cap floor in IDR. Tickers with market_cap_idr below this are excluded.
    # Set to 0 to disable. Example: 500_000_000_000 = 500B IDR.
    # Requires fundamentals_provider (Stockbit keystats) to be active.
    min_market_cap_idr: 0

  sector_breadth:
    # Legacy, dormant group-breadth score-bonus configuration. Production
    # composition deliberately supplies no group mapping, so this block does
    # not authorize or activate scoring. ADR-062 retires this production-policy
    # concept; a clean-removal task owns deleting the residual fields.
    # Do not wire idx_groups.yaml into accumulation scoring.
    enabled: true

    # Historical isolated-applier semantics only: if this fraction of mapped
    # group peers shows positive net_buy_ratio, the dormant applier adds points.
    breadth_threshold: 0.60

    # Historical dormant bonus; not production authority.
    bonus_pts: 10

    # Historical minimum support used by isolated tests only.
    min_tickers_for_breadth: 3

  broker_quality:
    # Smart-money foreign desks used for broker-quality scoring.
    smart_money:
      brokers: [AK, BK, KZ, ZP, RX, MS, DB, ML, YU]
      weight: 1.5

    # Domestic retail noise brokers used for broker-quality scoring.
    noise:
      brokers: [YP, PD, XL, XC]
      weight: 0.5

    smart_share_threshold_pct: 60.0
    smart_sell_min_share_pct: 15.0

    # Tier 1 foreign institutional desks used for BCI scoring.
    tier1:
      brokers: [AK, BK, ZP, KZ, YU, RX, HD, CP, DR]
      cluster_min_count: 3
      stable_min_count: 1

  evidence:
    # Rescaled 0-120 -> 0-100 (proportional /1.2, see ADR-039). All component
    # weights below are converted in lockstep with max_score.
    max_score: 100.0
    components:
      consistency:
        enabled: true
        weight: 33.3
      streak:
        enabled: true
        weight: 25.0
        tau_days: 7.0
      vwap_discount:
        enabled: true
        weight: 16.7
        saturate_pct: 10.0
      rsi_headroom:
        enabled: true
        weight: 8.3
        low: 25.0
        peak: 40.0
        high: 75.0
      foreign_flow_ratio:
        enabled: true
        weight: 8.3
        saturate_pct: 20.0
      bb_squeeze:
        # Disabled by default: BB compression is setup-phase/trigger-readiness
        # diagnostic (feeds SetupPhaseDetector COMPRESSION), not flow evidence.
        # Kept enabled=false with thresholds/weight retained for possible future
        # diagnostic/tuning use — do not flip to true without an explicit
        # architecture decision (see ARCHITECTURE_DECISIONS.md).
        enabled: false
        weight: 8.3
        tight_pctile: 0.20
        loose_pctile: 0.40
      bci:
        enabled: true
        cluster_points: 12.5
        stable_points: 4.2

  derived_features:
    # Price/flow feature windows used before foreign-flow scoring and setup gates.
    rsi_period: 14
    trend_sma_period: 20
    trend_threshold_pct: 2.0
    bb_period: 20
    bb_history: 60
    market_vwap_period: 20
    resistance_ma_period: 200
    resistance_high_period: 252
    insider_lookback_days: 90

  filters:
    min_accum_score:
      enabled: true
      value: 0.0
    min_signal_score:
      enabled: false
      value: 45.0

  sorting:
    primary: trade_setup
    secondary: signal_score
    tertiary: accum_score

  display:
    enter_min_accum_score: 58.3
    watch_min_accum_score: 33.3
    coiled_spring_min_accum_score: 50.0
    coiled_spring_bb_pctile: 0.20
