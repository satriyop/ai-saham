version: 1

accumulation_screener:
  screener:
    # Market cap floor in IDR. Tickers with market_cap_idr below this are excluded.
    # Set to 0 to disable. Example: 500_000_000_000 = 500B IDR.
    # Requires fundamentals_provider (Stockbit keystats) to be active.
    min_market_cap_idr: 0

  sector_breadth:
    # Set to false to disable sector breadth bonus entirely.
    enabled: true

    # If >= this fraction of sector peers show positive net_buy_ratio over
    # the screening window, apply a rotation bonus to all tickers in that sector.
    breadth_threshold: 0.60

    # Bonus points awarded when breadth threshold is met.
    bonus_pts: 10

    # Minimum tickers from the same idx_groups.yaml group that must appear
    # in the screened result set for breadth calculation to apply.
    min_tickers_for_breadth: 3

  broker_quality:
    # Smart-money foreign desks used for broker-quality scoring.
    smart_money:
      brokers: [AK, BK, KZ, ZP, RX, MS, DB, ML, YU]
      weight: 1.5

    # Domestic retail noise brokers used for broker-quality scoring.
    noise:
      brokers: [YP, PD, XL, XC]
      weight: 0.5

    smart_share_threshold_pct: 60.0
    smart_sell_min_share_pct: 15.0

    # Tier 1 foreign institutional desks used for BCI scoring.
    tier1:
      brokers: [AK, BK, ZP, KZ, YU, RX, HD, CP, DR]
      cluster_min_count: 3
      stable_min_count: 1

  evidence:
    max_score: 120.0
    components:
      consistency:
        enabled: true
        weight: 40.0
      streak:
        enabled: true
        weight: 30.0
        tau_days: 7.0
      vwap_discount:
        enabled: true
        weight: 20.0
        saturate_pct: 10.0
      rsi_headroom:
        enabled: true
        weight: 10.0
        low: 25.0
        peak: 40.0
        high: 75.0
        missing_fraction: 0.5
      foreign_flow_ratio:
        enabled: true
        weight: 10.0
        saturate_pct: 20.0
      bb_squeeze:
        # Disabled by default: BB compression is setup-phase/trigger-readiness
        # diagnostic (feeds SetupPhaseDetector COMPRESSION), not flow evidence.
        # Kept enabled=false with thresholds/weight retained for possible future
        # diagnostic/tuning use — do not flip to true without an explicit
        # architecture decision (see ARCHITECTURE_DECISIONS.md).
        enabled: false
        weight: 10.0
        tight_pctile: 0.20
        loose_pctile: 0.40
      bci:
        enabled: true
        cluster_points: 15.0
        stable_points: 5.0

  derived_features:
    # Price/flow feature windows used before foreign-flow scoring and setup gates.
    rsi_period: 14
    trend_sma_period: 20
    trend_threshold_pct: 2.0
    bb_period: 20
    bb_history: 60
    market_vwap_period: 20
    resistance_ma_period: 200
    resistance_high_period: 252
    insider_lookback_days: 90

  filters:
    min_foreign_flow_score:
      enabled: true
      value: 0.0
    min_signal_score:
      enabled: false
      value: 45.0

  sorting:
    primary: trade_setup
    secondary: signal_score
    tertiary: foreign_flow_score

  display:
    enter_min_foreign_flow_score: 70.0
    watch_min_foreign_flow_score: 40.0
    coiled_spring_min_foreign_flow_score: 60.0
    coiled_spring_bb_pctile: 0.20
