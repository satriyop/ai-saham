# IDX Conglomerate and Group Mappings
#
# Impacted CLI Commands:
#   - saham analyze sentiment TICKER (propagates sentiment across related tickers in groups)
#   - saham analyze audit (audits sentiment with group context)
#   - saham analyze risk TICKER --with-sentiment (adds group sentiment context)
#   - accumulation group-breadth score bonus: RETIRED as production policy by
#     ADR-062; production screen/capture composition must not inject this map
#
# These are conglomerate/business-group mappings, not an authoritative IDX
# sector taxonomy and not point-in-time membership. They remain available to
# their separately governed consumers; their presence grants no accumulation
# scoring or corpus-evidence authority.

