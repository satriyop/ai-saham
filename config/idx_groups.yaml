# IDX Conglomerate and Group Mappings
#
# Impacted CLI Commands:
#   - saham analyze sentiment TICKER (propagates sentiment across related tickers in groups)
#   - saham analyze audit (audits sentiment with group context)
#   - saham analyze risk TICKER --with-sentiment (adds group sentiment context)
#   - saham screen accum / saham screen swing (group maps for calculating sector breadth and BCI score rotation bonus)
#
# Used for sentiment propagation across related tickers.

