version: 1

accumulation_audit:
  setups:
    foreign-bounce:
      universe: idx80
      window: 7
      min_accum_score: 58.3
      min_net_buy_days: 2
      min_vwap_disc: 3.0
      trend: SIDE
      min_flow_pct: 5.0
      require_rsi: true
      max_rsi: 60.0
      simulate_exits: true
      take_profits: "4,5,6"
      stop_losses: "3,5,7"
      max_holds: "3,5,7,10"

    coiled-spring:
      universe: idx80
      window: 7
      min_accum_score: 50.0
      min_net_buy_days: 2
      min_flow_pct: 3.0
      require_rsi: true
      max_rsi: 65.0
      max_bb_width_pctile: 0.20
      simulate_exits: true
      take_profits: "4,5,6"
      stop_losses: "3,5,7"
      max_holds: "5,7,10,15"

    smart-money-confirmed:
      universe: idx80
      window: 7
      min_accum_score: 50.0
      min_net_buy_days: 2
      broker_quality: smart+
      simulate_exits: true
      take_profits: "4,5,6"
      stop_losses: "3,5,7"
      max_holds: "3,5,7,10"

    pullback-continuation:
      universe: idx80
      window: 7
      min_accum_score: 45.8
      min_net_buy_days: 2
      min_vwap_disc: -2.0
      trend: UP
      min_flow_pct: 2.0
      require_rsi: true
      min_rsi: 40.0
      max_rsi: 65.0
      simulate_exits: true
      take_profits: "5,8,10"
      stop_losses: "4,5,7"
      max_holds: "5,10,15"

  measurement:
    # Forward close-to-close return horizons emitted on each audit record.
    forward_return_horizons: [5, 10, 20]

    # Extra calendar-day buffer used when fetching forward candles.
    # This absorbs weekends/holidays without changing the requested horizon.
    forward_fetch_buffer_days: 40

  exit_simulation:
    # Extra calendar-day buffer used when fetching TP/SL/max-hold candles.
    fetch_buffer_days: 40

    # If a daily candle touches stop and target on the same day, choose the
    # conservative sequence unless explicitly changed during tuning.
    same_day_priority: stop_first

  grouping:
    # Sessions of named top-broker detail used to classify broker_quality.
    broker_quality_window_sessions: 5

    # Summary dimensions shown in audit learning tables.
    dimensions:
      - accum_score
      - streak
      - flow_pct
      - vwap_disc_pct
      - rsi
      - bb_pctile
      - trend
      - broker_quality

    # Bucket edges for learning reports. Values below the first edge use
    # "<edge"; values at/above the last edge use "edge+".
    bucket_edges:
      accum_score: [33.3, 58.3]
      streak: [3, 5]
      flow_pct: [5, 15]
      vwap_disc_pct: [0, 5]
      rsi: [30, 45, 60]
      bb_pctile: [0.20, 0.40]
