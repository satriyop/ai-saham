# Risk Engine Configuration
#
# Controls which gates participate in the risk pipeline and at what thresholds.
# A disabled gate is completely skipped — pipeline continues to the next gate.
#
# enabled: false  removes the gate from the pipeline entirely
# Threshold fields map directly to gate constructor parameters.
#
# See ADR-024 Engine Configurability Contract for full semantics.
# Gate order: fundamental → liquidity → free_float (structural), bandar (execution).
#
version: 1
risk_engine:

  # Indicator defaults used by RiskEngine and optional TechnicalGate paths.
  indicators:
    sma_period: 20
    ema_period: 20
    rsi_period: 14
    history_days: 365
    gate_recent_candle_lookback: 20

  # How MarketContext gate_tightening affects the risk preview path.
  # This remains preview/enrichment unless the caller explicitly applies
  # market context to RiskEngine.
  market_context_gate:
    enabled: true
    block_when_gate_tightening: true
    gate_is_structural: true
    label_prefix: "regime"

  gates:
    # What a gate that RAN but had no usable input (GateOutcome.UNEVALUABLE)
    # means for the aggregate risk assessment. Orthogonal to each gate's own
    # missing_data_action, which decides whether that one gate blocks alone.
    #
    #   surface — record the unknown, do not block. An unknown is not a reason
    #             to reject, but it is never laundered into a pass: the gate
    #             names appear in RiskAssessment.unevaluable_gates and in the
    #             rationale. This is the pre-existing behaviour and the default.
    #   block   — any unevaluable gate blocks the candidate. Currently this
    #             would reject roughly half the IDX universe (fundamentals
    #             coverage starts 2026-07-08); do not switch without review.
    #
    # Anything else fails closed at config resolve time.
    #
    # NOTE: `surface` leaves canonical output identical to before this key
    # existed, so it is deliberately NOT part of the accumulation production
    # policy snapshot identity. Switching to `block` changes what can produce
    # ENTER/WATCH/AVOID and MUST add this policy to that snapshot first,
    # otherwise two different cohorts would share one compatibility identity.
    unevaluable_policy: surface
    unevaluable_block_confidence: 0

    fundamental:
      enabled: true
      piotroski_min: 3          # F-score <= this → HIGH_RISK (FundamentalGate.distress_threshold)
      missing_data_action: skip # skip | block | warn (warn is non-blocking diagnostic)
      missing_data_confidence: 0
      triggered_confidence: 100
      pass_confidence: 100
    liquidity:
      enabled: true
      market_cap_floor_idr: 1_000_000_000_000   # 1T IDR — LiquidityGate market-cap floor
      median_tx_floor_idr: 5_000_000_000        # 5B IDR median 20-day tx value floor
      lookback_days: 20
      missing_data_action: skip
      missing_data_confidence: 0
      triggered_confidence: 100
      pass_confidence: 100
    free_float:
      enabled: true
      min_free_float_pct: 15.0
      missing_data_action: skip
      missing_data_confidence: 0
      triggered_confidence: 100
      pass_confidence: 100
    bandar:
      enabled: true
      distribution_labels:
        - "Small Dist"
        - "Big Dist"
      missing_data_action: skip
      missing_data_confidence: 0
      triggered_confidence: 80
      pass_confidence: 100
    technical:
      # TechnicalGate remains opt-in from saham analyze swing
      # (--with-technical-gate). This block only tunes its behavior.
      block_when_bearish: true
      missing_data_action: skip
      missing_data_confidence: 0
      pass_confidence: 100
      evaluator:
        rsi_overbought: 70.0
        rsi_oversold: 30.0
        agreement_count: 2
        full_agreement_confidence: 100
        partial_agreement_confidence: 50
