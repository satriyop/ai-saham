# Sector Macro Context Evidence (ADR-053)
#
# Evidence authority: DIAGNOSTIC (v1)
# Routes external macro series to universe groups (universes.yaml keys).
# Sibling of peer-relative SectorContextEvidence — does NOT score Signal/Risk.
#
# Return units: fractional session returns (0.05 = +5%).
# Promotion requires a future ADR + walk-forward proof.

sector_macro_context:
  evidence_status: DIAGNOSTIC

  lookback_sessions: 20
  min_valid_sessions: 15
  # Below this coverage, macro_regime is UNKNOWN even if partial scores exist.
  min_coverage_to_label: 0.5

  # Score → factor label anchors (same family as MCE score labels).
  score_labels:
    favorable_min: 0.65
    neutral_min: 0.35

  # Composite → macro_regime anchors.
  regime_thresholds:
    supportive_min: 0.65
    headwind_max: 0.35

  factor_library:
    # WTI crude — Yahoo-live (2026-07 smoke). Newcastle coal (MTF=F) and old
    # CPO (KO=F) return no data on Yahoo; do not map dead symbols into live maps.
    oil_proxy:
      series: "CL=F"
      kind: return_sessions
      invert: false
      thresholds:
        supportive_min: 0.05   # +5% over lookback → score 1.0
        headwind_max: -0.05    # -5% → score 0.0

    usd_idr:
      series: "IDR=X"
      kind: return_sessions
      # Rising IDR=X = weaker Rupiah; often supportive for USD-linked exporters.
      # invert=false: higher return → higher score (commodity-like).
      invert: false
      thresholds:
        supportive_min: 0.01
        headwind_max: -0.01

    # Bank / risk-context FX: weaker Rupiah (higher USDIDR) = financial-conditions headwind.
    # Separate library entry so commodity maps keep invert=false on usd_idr.
    usd_idr_risk:
      series: "IDR=X"
      kind: return_sessions
      invert: true
      thresholds:
        supportive_min: 0.01
        headwind_max: -0.01

    # US 10Y yield — financial-conditions proxy for bank risk context (not NIM model).
    # invert=true: rising yields → lower score (tighter conditions / risk-off).
    us_10y:
      series: "^TNX"
      kind: return_sessions
      invert: true
      thresholds:
        supportive_min: 0.01
        headwind_max: -0.01

    # Palm oil futures — Yahoo-live (CPO=F). Not KO=F (dead).
    cpo:
      series: "CPO=F"
      kind: return_sessions
      invert: false
      thresholds:
        supportive_min: 0.05
        headwind_max: -0.05

    # COMEX copper — Yahoo-live. Prefer dedicated metals cohort, not full basic_materials.
    copper:
      series: "HG=F"
      kind: return_sessions
      invert: false
      thresholds:
        supportive_min: 0.05
        headwind_max: -0.05

  # Primary keys = universes.yaml group names (same as L2a sector context).
  # Live maps only for groups with ≥2 real drivers. Prefer dedicated cohorts
  # over broad bags (consumer_goods, basic_materials, finance-without-bank-key).
  sector_maps:
    energy:
      factors:
        - { ref: oil_proxy, weight: 0.65 }
        - { ref: usd_idr, weight: 0.35 }
    plantation:
      factors:
        - { ref: cpo, weight: 0.70 }
        - { ref: usd_idr, weight: 0.30 }
    metals:
      factors:
        - { ref: copper, weight: 0.55 }
        - { ref: usd_idr, weight: 0.45 }
    # Defensive bank risk context (not NIM expansion model). Both rising rates and
    # weaker IDR score as headwind. Uses existing universes.yaml `bank` group.
    bank:
      factors:
        - { ref: us_10y, weight: 0.55 }
        - { ref: usd_idr_risk, weight: 0.45 }
