# Sector Macro Context Evidence (ADR-053)
#
# Evidence authority: DIAGNOSTIC (v1)
# Routes external macro series to universe groups (universes.yaml keys).
# Sibling of peer-relative SectorContextEvidence — does NOT score Signal/Risk.
#
# Return units: fractional session returns (0.05 = +5%).
# Promotion requires a future ADR + walk-forward proof.

sector_macro_context:
  evidence_status: DIAGNOSTIC

  lookback_sessions: 20
  min_valid_sessions: 15
  # Below this coverage, macro_regime is UNKNOWN even if partial scores exist.
  min_coverage_to_label: 0.5

  # Score → factor label anchors (same family as MCE score labels).
  score_labels:
    favorable_min: 0.65
    neutral_min: 0.35

  # Composite → macro_regime anchors.
  regime_thresholds:
    supportive_min: 0.65
    headwind_max: 0.35

  factor_library:
    # WTI crude — Yahoo-live (2026-07 smoke). Newcastle coal (MTF=F) and old
    # CPO (KO=F) return no data on Yahoo; do not map dead symbols into live maps.
    #
    # Two economic signs (same series, different invert):
    #   oil_proxy  invert=false → price↑ supportive (upstream energy, export)
    #   oil_cost   invert=true  → price↑ headwind (fuel/feedstock cost maps)
    oil_proxy:
      series: "CL=F"
      kind: return_sessions
      invert: false
      thresholds:
        supportive_min: 0.05   # +5% over lookback → score 1.0
        headwind_max: -0.05    # -5% → score 0.0

    oil_cost:
      series: "CL=F"
      kind: return_sessions
      invert: true
      thresholds:
        supportive_min: 0.05
        headwind_max: -0.05

    # Thermal coal complex proxy — Yahoo has no live Newcastle futures (MTF=F dead).
    # Global X Coal ETF (COAL) is an imperfect but live stand-in until a better series exists.
    # invert=false: higher coal complex → supportive for thermal coal exporters/miners.
    coal_proxy:
      series: "COAL"
      kind: return_sessions
      invert: false
      thresholds:
        supportive_min: 0.05
        headwind_max: -0.05

    usd_idr:
      series: "IDR=X"
      kind: return_sessions
      # Rising IDR=X = weaker Rupiah; often supportive for USD-linked exporters.
      # invert=false: higher return → higher score (commodity-like).
      invert: false
      thresholds:
        supportive_min: 0.01
        headwind_max: -0.01

    # Bank / risk-context FX: weaker Rupiah (higher USDIDR) = financial-conditions headwind.
    # Separate library entry so commodity maps keep invert=false on usd_idr.
    usd_idr_risk:
      series: "IDR=X"
      kind: return_sessions
      invert: true
      thresholds:
        supportive_min: 0.01
        headwind_max: -0.01

    # US 10Y yield — optional global rates proxy (library only; Track B live maps
    # use BI policy steps for IDX domestic rates-sensitive groups instead).
    # invert=true: rising yields → lower score (tighter conditions / risk-off).
    us_10y:
      series: "^TNX"
      kind: return_sessions
      invert: true
      thresholds:
        supportive_min: 0.01
        headwind_max: -0.01

    # BI policy-rate steps from macro calendar (not continuous SBN/INDONIA).
    # Virtual series BI_RATE — not Yahoo. invert=true: hike net → headwind (defensive).
    # Used by bank + domestic rates maps (cement, property_dev, telco, insurance,
    # multifinance). value = net step count (hike +1 / cut -1) over lookback_days.
    bi_rate_policy:
      series: "BI_RATE"
      kind: policy_rate_steps
      invert: true
      lookback_days: 180
      thresholds:
        supportive_min: 1.0
        headwind_max: -1.0

    # Palm oil futures — Yahoo-live (CPO=F). Not KO=F (dead).
    cpo:
      series: "CPO=F"
      kind: return_sessions
      invert: false
      thresholds:
        supportive_min: 0.05
        headwind_max: -0.05

    # COMEX copper — Yahoo-live. Prefer dedicated metals cohort, not full basic_materials.
    copper:
      series: "HG=F"
      kind: return_sessions
      invert: false
      thresholds:
        supportive_min: 0.05
        headwind_max: -0.05

    # COMEX gold — Yahoo-live. Dedicated gold cohort only (not bolted onto metals).
    gold_proxy:
      series: "GC=F"
      kind: return_sessions
      invert: false
      thresholds:
        supportive_min: 0.05
        headwind_max: -0.05

    # CBOT corn / soy — feed-cost stress for poultry integrators (not agri-bull map).
    # invert=true: rising grain = headwind for CPIN/JPFA-style feeders.
    corn:
      series: "ZC=F"
      kind: return_sessions
      invert: true
      thresholds:
        supportive_min: 0.03
        headwind_max: -0.03

    soy:
      series: "ZS=F"
      kind: return_sessions
      invert: true
      thresholds:
        supportive_min: 0.03
        headwind_max: -0.03

  # Primary keys = universes.yaml group names (same as L2a sector context).
  # Live maps only for groups with ≥2 real drivers. Prefer dedicated cohorts
  # over broad bags (consumer_goods, basic_materials, finance-without-bank-key).
  sector_maps:
    # P1b: specific energy cohorts BEFORE parent `energy` so multi-membership
    # resolve prefers coal/oil_gas over the residual oil-led energy fallback.
    coal:
      factors:
        - { ref: coal_proxy, weight: 0.65 }
        - { ref: usd_idr, weight: 0.35 }
    oil_gas:
      factors:
        - { ref: oil_proxy, weight: 0.65 }
        - { ref: usd_idr, weight: 0.35 }
    # Residual energy names not in coal/oil_gas — oil+IDR fallback (imperfect).
    energy:
      factors:
        - { ref: oil_proxy, weight: 0.65 }
        - { ref: usd_idr, weight: 0.35 }
    plantation:
      factors:
        - { ref: cpo, weight: 0.70 }
        - { ref: usd_idr, weight: 0.30 }
    metals:
      factors:
        - { ref: copper, weight: 0.55 }
        - { ref: usd_idr, weight: 0.45 }
    gold:
      factors:
        - { ref: gold_proxy, weight: 0.65 }
        - { ref: usd_idr, weight: 0.35 }
    # Cement / building materials: domestic BI policy + FX (defensive).
    # Track B: local BI steps replace US 10Y for IDX rates-sensitive maps.
    cement:
      factors:
        - { ref: bi_rate_policy, weight: 0.55 }
        - { ref: usd_idr_risk, weight: 0.45 }
    # Basic chemicals / petrochem: feedstock cost stress (P1a), not oil-bull map.
    chemicals:
      factors:
        - { ref: oil_cost, weight: 0.60 }
        - { ref: usd_idr_risk, weight: 0.40 }
    # Property developers: same defensive BI + FX family as cement/bank.
    property_dev:
      factors:
        - { ref: bi_rate_policy, weight: 0.55 }
        - { ref: usd_idr_risk, weight: 0.45 }
    # Logistics / shipping: fuel cost + FX stress (P1a; not oil-bull map).
    logistics:
      factors:
        - { ref: oil_cost, weight: 0.60 }
        - { ref: usd_idr_risk, weight: 0.40 }
    # Poultry / feed: grain cost + import FX (P1c). Still not a chicken-price model.
    poultry:
      factors:
        - { ref: corn, weight: 0.40 }
        - { ref: soy, weight: 0.35 }
        - { ref: usd_idr_risk, weight: 0.25 }
    # Telco / towers: domestic funding via BI policy + FX risk (not US 10Y).
    telco:
      factors:
        - { ref: bi_rate_policy, weight: 0.55 }
        - { ref: usd_idr_risk, weight: 0.45 }
    # Non-life/life insurers — uses existing universes.yaml `insurance` group.
    # Same defensive BI + FX family as banks (float + risk context).
    insurance:
      factors:
        - { ref: bi_rate_policy, weight: 0.55 }
        - { ref: usd_idr_risk, weight: 0.45 }
    # Multifinance / consumer lenders (not banks). BI funding + IDR risk stress.
    multifinance:
      factors:
        - { ref: bi_rate_policy, weight: 0.55 }
        - { ref: usd_idr_risk, weight: 0.45 }
    # Plastics / packaging: resin/feedstock cost + FX stress (P1a).
    packaging:
      factors:
        - { ref: oil_cost, weight: 0.60 }
        - { ref: usd_idr_risk, weight: 0.40 }
    # Defensive bank risk context (not NIM expansion model). P2a: local BI policy
    # steps + IDR risk. Uses existing universes.yaml `bank` group.
    bank:
      factors:
        - { ref: bi_rate_policy, weight: 0.55 }
        - { ref: usd_idr_risk, weight: 0.45 }
