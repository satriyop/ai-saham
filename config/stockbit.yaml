# Stockbit / Exodus API configuration
#
# Impacted CLI Commands:
#   - saham fetch stockbit login / status / spy / test / browse / fetch-top5
#   - saham fetch market (when loading company profiles, fundamentals, shareholdings, insider info, or corporate actions)
#   - saham fetch broker (when summary source is configured as stockbit)
#   - saham screen pre-open (requests orderbook/IEV data via Exodus API endpoints defined here)
#   - saham learn snapshot / track (requests market session state/running trades)
#
# This file contains the two things that change due to market structure or
# Stockbit frontend updates — not implementation details like timeouts.
#
# To update an endpoint URL: run `saham fetch stockbit spy` to discover the new URL
# from DevTools, then update the value here. Note: if the response SHAPE also
# changed, the paired parser in playwright_stockbit.py must be updated too.
#
# Last verified: 2026-06-13 via DevTools spy session.

# ── Exodus API endpoints ───────────────────────────────────────────────────
#
# All endpoints require a Bearer JWT extracted from an active browser session.
# The JWT is obtained by navigating to a Stockbit page that fires authenticated
# requests, then intercepting the Authorization header.

endpoints:

  iev_movers_main:
    url: "https://exodus.stockbit.com/order-trade/market-mover\
?mover_type=MOVER_TYPE_IEV_TOP_GAINER\
&filter_stocks=FILTER_STOCKS_TYPE_MAIN_BOARD\
&filter_stocks=FILTER_STOCKS_TYPE_DEVELOPMENT_BOARD\
&filter_stocks=FILTER_STOCKS_TYPE_ACCELERATION_BOARD\
&filter_stocks=FILTER_STOCKS_TYPE_NEW_ECONOMY_BOARD"
    trigger_page: "https://stockbit.com/orderbook"
    # Returns: ranked list of pre-open movers for main + development + acceleration + new economy boards.
    # Response shape: data.mover_list[].stock_detail.code  → ticker
    #                 data.mover_list[].iepiev_detail.iev.raw → IEV (lots, integer)
    #                 data.mover_list[].iepiev_detail.iep.raw → IEP (IDR, integer, may be absent)
    # Extracted and stored: ticker, IEV, IEP → iev_snapshots + iev_snapshot_history tables

  iev_movers_special:
    url: "https://exodus.stockbit.com/order-trade/market-mover\
?mover_type=MOVER_TYPE_IEV_TOP_GAINER\
&filter_stocks=FILTER_STOCKS_TYPE_SPECIAL_MONITORING_BOARD"
    trigger_page: "https://stockbit.com/orderbook"
    # Returns: same shape as iev_movers_main but for the Special Monitoring Board only.
    # Both endpoints are called every collect-iev run; results are merged and deduplicated
    # (highest IEV wins if a ticker appears in both). Stored identically.
    # Extracted and stored: ticker, IEV, IEP → iev_snapshots + iev_snapshot_history tables

  orderbook:
    url: "https://exodus.stockbit.com/company-price-feed/v2/orderbook/companies/{ticker}"
    trigger_page: "https://stockbit.com/orderbook"
    # Returns: full order book for one ticker at the moment of the call.
    # Response shape:
    #   data.iepiev.best_bid_offer.bid.price.raw      → best bid price (IDR)
    #   data.iepiev.best_bid_offer.bid.quantity.raw   → best bid lots (already in lots)
    #   data.iepiev.best_bid_offer.offer.price.raw    → best offer price (IDR)
    #   data.iepiev.best_bid_offer.offer.quantity.raw → best offer lots (already in lots)
    #   data.bid[]                                    → full bid depth (price as string, volume in shares)
    #   data.offer[]                                  → full offer depth (price as string, volume in shares)
    #
    # Currently extracted: best bid price + lots → OrderBookBid (used for gap% in pre-open screener)
    # Currently NOT stored: best offer price/lots (parsed but discarded), full depth arrays
    # Opportunity: offer side is already parsed — storing it costs nothing extra per API call

  broker_marketdetectors:
    url: "https://exodus.stockbit.com/marketdetectors"
    trigger_page: "https://stockbit.com/broker-analysis/stock"
    # Returns: stock-centric named broker breakdown for one ticker on the current trading day.
    # Response shape:
    #   data.broker_summary.brokers_buy[].netbs_broker_code → broker code
    #   data.broker_summary.brokers_buy[].blot              → net buy lots
    #   data.broker_summary.brokers_buy[].bval              → net buy value (IDR)
    #   data.broker_summary.brokers_buy[].netbs_buy_avg_price → avg buy price
    #   data.broker_summary.brokers_buy[].type              → "Asing" (foreign) or local
    #   data.broker_summary.brokers_buy[].netbs_date        → date (YYYYMMDD)
    #   data.broker_summary.brokers_sell[]                  → same shape, negative values
    #
    # Extracted and stored: top 10 buyers + top 10 sellers (broker_code, lots, value, avg_price,
    # foreign/local flag), aggregated foreign_buy_value, foreign_sell_value, foreign_buy_lot,
    # foreign_sell_lot, total_value, total_lot → broker_summaries table

  historical_summary:
    url: "https://exodus.stockbit.com/company-price-feed/historical/summary/{ticker}"
    # Returns: daily OHLCV + true total traded value for one ticker.
    # Called once per fetch_broker_summaries() call to replace the synthetic total.
    # Response shape (confirmed 2026-06-20, BBCA):
    #   data.result[].date    → "YYYY-MM-DD"
    #   data.result[].value   → total traded value (IDR) — true market turnover
    #   data.result[].volume  → total traded lots (already in lots, NOT shares)
    #   data.result[].foreign_buy / foreign_sell / net_foreign → foreign flow (IDR)
    # Params: period=HS_PERIOD_DAILY, start_date, end_date, limit=400, page=1

  broker_activity:
    url: "https://exodus.stockbit.com/order-trade/broker/activity"
    trigger_page: "https://stockbit.com/broker-analysis/broker"
    # Returns: broker-centric universe scan — for a given broker code, which stocks it is
    # net buying or net selling today.
    # Response shape:
    #   data.broker_activity_transaction.brokers_buy[].stock_code → ticker
    #   data.broker_activity_transaction.brokers_buy[].value      → net value (IDR)
    #   data.broker_activity_transaction.brokers_buy[].lot        → net lots
    #   data.broker_activity_transaction.brokers_buy[].avg_price  → average price
    #   data.broker_activity_transaction.brokers_buy[].type       → investor type
    #   data.broker_activity_transaction.brokers_sell[]           → same shape, negative values
    #
    # Extracted and stored: ticker, net_val, net_lot per stock → ForeignFlowSnapshot
    # Used for: foreign accumulation screener (which stocks are institutions net buying today)

  broker_historical:
    url: "https://exodus.stockbit.com/order-trade/broker/activity/historical"
    trigger_page: "https://stockbit.com/broker-analysis/broker"
    # Returns: per-broker, per-ticker daily time-series (up to 1 year, paginated 100/page).
    # Called once per broker code — multi-code calls aggregate and lose per-broker identity.
    # Response shape:
    #   data.records[].date                                → "YYYY-MM-DD"
    #   data.records[].trade_activity.buy_summary.lot      → buy lots
    #   data.records[].trade_activity.buy_summary.value    → buy value (IDR)
    #   data.records[].trade_activity.buy_summary.avg_price → avg buy price
    #   data.records[].trade_activity.sell_summary.lot     → sell lots
    #   data.records[].trade_activity.sell_summary.value   → sell value (IDR)
    #   data.records[].trade_activity.sell_summary.avg_price → avg sell price
    #   data.records[].trade_activity.net_summary.lot      → net lots (negative = net sell)
    #   data.records[].trade_activity.net_summary.value    → net value (negative = net sell)
    #   data.records[].trade_activity.net_summary.avg_price → avg net price
    #   data.records[].trade_activity.total_buy_lot.pct    → broker's market share of buy volume (%)
    #   data.records[].trade_activity.total_sell_lot.pct   → broker's market share of sell volume (%)
    #   data.records[].price_activity.close_price          → closing price (fallback for avg_price)
    #   data.pagination.has_next                           → pagination flag
    #
    # Extracted and stored: date, broker_code, broker_name, buy_lot, sell_lot, net_lot,
    # buy_value, sell_value, net_value, avg_buy_price, avg_sell_price, avg_price,
    # buy_pct, sell_pct → broker_daily_flows table (source="stockbit")

  bandar_detector:
    url: "https://exodus.stockbit.com/marketdetectors/{ticker}?transaction_type=TRANSACTION_TYPE_NET&market_board=MARKET_BOARD_REGULER&investor_type=INVESTOR_TYPE_ALL&limit=25&period=BROKER_SUMMARY_PERIOD_LATEST"
    # Returns: per-ticker bandar detector signal (acc/dist classification + operator analysis).
    # Different from broker_marketdetectors (which is broker-centric); this is stock-centric.

  running_trade:
    url: "https://exodus.stockbit.com/order-trade/running-trade?symbols[]={ticker}&sort=DESC&limit={limit}&order_by=RUNNING_TRADE_ORDER_BY_TIME"
    # Returns: real-time executed trade ticks (time, price, vol, buyer/seller flag).

  running_trade_chart:
    url: "https://exodus.stockbit.com/order-trade/running-trade/chart/{ticker}"
    # Returns: minute-level intraday OHLC + per-broker cumulative net value lines.

  intraday_broker_chart:
    url: "https://exodus.stockbit.com/order-trade/broker/activity-chart?period=RT_PERIOD_LAST_1_DAY&brokers_code={broker_code}&investor_type=INVESTOR_TYPE_ALL&market_board=MARKET_TYPE_REGULER"
    # Returns: broker-centric intraday buy/sell bar chart for a given broker code.

  company_profile:
    url: "https://exodus.stockbit.com/emitten/{ticker}/profile"
    # Returns: company description, sector, listing date, shares outstanding.

  seasonality:
    url: "https://exodus.stockbit.com/company-price-feed/seasonality/{ticker}?year={year}&back_year={back_years}"
    # Returns: avg monthly return + win-rate per month over N historical years.

  analyst_ratings:
    url: "https://exodus.stockbit.com/analyst-ratings/{ticker}"
    # Returns: analyst buy/hold/sell recommendations with target prices.

  analyst_consensus:
    url: "https://exodus.stockbit.com/analyst-ratings/{ticker}/consensus"
    # Returns: aggregated consensus (mean target, rating distribution).

  emitten_info:
    url: "https://exodus.stockbit.com/emitten/{ticker}/info"
    # Returns: ticker notation metadata (listing board, trading unit, lot size).

  keystats:
    url: "https://exodus.stockbit.com/keystats/ratio/v1/{ticker}?year_limit=10"
    # Returns: annual fundamental ratios (PBV, PER, ROE, DER, EPS, market cap, etc.)

  shareholding:
    url: "https://exodus.stockbit.com/insider/shareholding/composition/companies/{ticker}"
    # Returns: latest shareholding composition (institution %, individual %, top holders).

  insider:
    url: "https://exodus.stockbit.com/insider/company/majorholder?symbols={ticker}&date_start={from_date}&date_end={to_date}&page=1&limit=50&action_type={action_param}&source_type=SOURCE_TYPE_UNSPECIFIED"
    # Returns: insider buy/sell transactions (name, role, shares, value).

  market_time:
    url: "https://exodus.stockbit.com/company-price-feed/market-time"
    # Returns: current exchange session state (pre-open, regular, post-close, etc.)

  earnings:
    url: "https://exodus.stockbit.com/earnings?keyword={ticker}&quarter={quarter}&year={year}"
    # Returns: quarterly EPS history.

  valuation_metrics:
    url: "https://exodus.stockbit.com/valuation/company/{ticker}/metrics"
    # Returns: P/E, EPS TTM, and basic valuation multiples.

  broker_distribution:
    url: "https://exodus.stockbit.com/order-trade/broker/distribution?date=&symbol={ticker}&investor_type=INVESTOR_TYPE_ALL&market_board=MARKET_TYPE_REGULER&data_type=BROKER_DISTRIBUTION_DATA_TYPE_VALUE&period=TB_PERIOD_LAST_1_DAY"
    # Returns: broker buy/sell volume and value distribution matrix.

  universe_sector_88:
    url: "https://exodus.stockbit.com/emitten/sectors/88/subsectors"
    # Returns: subsector list for sector code 88 (used in universe screener).

  universe_sector_70:
    url: "https://exodus.stockbit.com/emitten/sectors/70/subsectors"
    # Returns: subsector list for sector code 70.

  universe_company:
    url: "https://exodus.stockbit.com/emitten/v3/sector/{sector}/subsector/{id}/company"
    # Returns: list of companies in a given sector/subsector.

  universe_screener:
    url: "https://exodus.stockbit.com/screener/universe"
    # Returns: full universe ticker list from Stockbit screener.

  corp_action:
    url: "https://exodus.stockbit.com/corpaction/{ticker}?limit=50"
    trigger_page: "https://stockbit.com/stocks/{ticker}"
    # Returns: upcoming and recent corporate actions for one ticker.
    # Response shape (exact field names to confirm via saham fetch stockbit spy --target stock-profile):
    #   data[].action_type / type       → action category string (e.g. "dividend", "rightissue")
    #   data[].ex_date / exDate         → ex-date (YYYY-MM-DD or DD/MM/YYYY)
    #   data[].cum_date / cumDate       → cum-date
    #   data[].record_date / recordDate → recording date
    #   data[].payment_date             → payment / distribution date
    #   data[].announcement_date        → announcement date
    #   data[].dividend_amount / amount → cash per share (dividend)
    #   data[].ratio / split_ratio      → ratio (split / rights)
    #   data[].subscription_price       → HMETD subscription price (rights issue)
    #   data[].agenda / rups_agenda     → RUPS meeting agenda text
    #   data[].status                   → "announced" | "completed" | "cancelled"
    #
    # Extracted and stored: event_type, ex_date, cum_date, record_date, payment_date,
    # announcement_date, detail → corp_action_cache table (SQLite daily cache, TTL = calendar day)
    # Used for: dividend_risk, rights_issue_risk, upcoming_rups flags on AccumulationCandidate

# ── Browser scraper cache TTLs (days) ────────────────────────────────────
#
# Controls how long fetched data is kept before the next full refresh.
# Increase any value if you prefer less frequent re-fetches.
cache_ttl_days:
  company_profile: 30   # sector, listing date, shares outstanding
  fundamentals: 7       # annual ratios (PBV, PER, ROE, EPS, etc.)
  shareholding: 7       # shareholding composition (institution %, top holders)

# ── Browser timeouts ──────────────────────────────────────────────────────

timeouts:
  nav_ms: 30000       # Playwright page.goto() timeout
  element_ms: 15000   # Playwright element wait timeout
  spa_settle_ms: 4000 # Extra wait after navigation for React to render

# ── Broker codes ───────────────────────────────────────────────────────────

broker_codes:

  # Subset used to compute the foreign_flow_points aggregate signal.
  # These are NOT all foreign brokers — they are major institutional desks that
  # concentrate most foreign-style order flow. YP (Indo Premier) is domestic but
  # consistently mirrors institutional behaviour.
  # For true all-foreign aggregate, use broker_summaries.foreign_net_value (IDX source).
  institutional_proxy:
    - AK   # UBS Sekuritas Indonesia
    - ZP   # Macquarie Sekuritas Indonesia
    - YP   # Indo Premier Sekuritas (domestic, high foreign-flow proxy)
    - BK   # J.P. Morgan Sekuritas Indonesia
    - YU   # Deutsche Sekuritas Indonesia
    - CP   # Valbury Asia Securities
    - KZ   # CIMB Sekuritas Indonesia
    - HD   # HD Capital Securities
    - RX   # Macquarie Capital Securities
    - DR   # OSO Securities

  # Brokers fetched individually via broker_historical for per-identity daily tracking.
  # Call the historical endpoint ONCE PER CODE — multi-code calls aggregate and lose identity.
  # CS (Credit Suisse) excluded: wound down Indonesian operations (confirmed 0 trades).
  tracked:
    - AK   # UBS Sekuritas Indonesia (foreign)
    - ZP   # Macquarie Sekuritas Indonesia (foreign)
    - YP   # Indo Premier Sekuritas (domestic, high foreign-flow proxy)
    - BK   # J.P. Morgan Sekuritas Indonesia (foreign)
    - YU   # Deutsche Sekuritas Indonesia (foreign)
    - CP   # Valbury Asia Securities (foreign)
    - KZ   # CIMB Sekuritas Indonesia (foreign)
    - HD   # HD Capital Securities (foreign)
    - RX   # Macquarie Capital Securities (foreign)
    - DR   # OSO Securities (foreign)
    - XL   # Stockbit Sekuritas Digital (domestic retail)
    - PD   # Phintraco Sekuritas (domestic retail)
    - MS   # Morgan Stanley Sekuritas Indonesia (institutional)
    - DB   # Deutsche Bank Sekuritas Indonesia (institutional)
    - ML   # Merrill Lynch Sekuritas Indonesia (institutional)
