# Swing Setup Configuration
#
# Owns named swing setup gate policy only.
#
version: 1
name: "swing-setups"
description: |
  Deterministic named setup gates for swing workflows.
  Setup evaluation answers whether a candidate fits a setup; final action remains
  owned by SignalEngine + RiskEngine -> TradeSetup.

setups:
  foreign-bounce:
    enabled: true
    family: accumulation
    entry_authority: true
    can_enter_from_phases: [BREAKOUT_CONFIRMATION]
    # Reversal/absorption: foreigners are accumulating while price is still depressed.
    gates:
      min_accum_score: 58.3             # composite foreign-flow score gate (0-100 scale)
      min_vwap_discount_pct: 3.0 # foreigners must be underwater >= 3% below VWAP
      required_trend: SIDE       # pre-accumulation trend must be sideways
      min_flow_ratio_pct: 5.0    # foreign flow >= 5% of daily turnover over window
      max_rsi: 60                # not overbought; room to run
    partial_max_failed_gates: 2

  coiled-spring:
    enabled: true
    family: breakout
    entry_authority: true
    can_enter_from_phases: [BREAKOUT_CONFIRMATION]
    # Breakout preparation: accumulation is present while volatility compresses.
    gates:
      min_accum_score: 50.0
      max_bb_width_pctile: 0.20
      min_flow_ratio_pct: 3.0
      max_rsi: 65
    partial_max_failed_gates: 2

  smart-money-confirmed:
    enabled: true
    family: confirmation
    entry_authority: false
    can_enter_from_phases: []
    # Quality filter: named-broker attribution confirms the accumulation.
    # No standalone entry authority — confirms flow quality but cannot alone
    # promote a candidate to ENTER (see DecisionPolicyService).
    gates:
      min_accum_score: 50.0
      min_smart_flow_idr: 0
      min_smart_share_pct: 30.0
      max_noise_share_pct: 60.0
      reject_smart_net_selling: true
    partial_max_failed_gates: 1

  pullback-continuation:
    enabled: true
    family: pullback
    entry_authority: true
    can_enter_from_phases: [BREAKOUT_CONFIRMATION]
    # Trend-following: controlled pullback/accumulation inside an uptrend.
    gates:
      min_accum_score: 45.8
      required_trend: UP
      min_flow_ratio_pct: 2.0
      min_rsi: 40
      max_rsi: 65
      min_vwap_discount_pct: -2.0
    partial_max_failed_gates: 2

setup_phase:
  thresholds:
    # Rescaled 0-120 -> 0-100 (ADR-039). Naming still says flow_score historically;
    # value is an accum_score threshold (ADR-043). Currently NOT read by
    # SetupPhaseDetector's accumulation-phase gate (_constructive_phase() uses
    # passed_gates/flow_status instead) — kept as a config value for potential
    # future wiring, not an active behavior lever.
    accumulation_min_flow_score: 50.0
    accumulation_min_flow_ratio_pct: 2.0
    compression_max_bb_width_pctile: 0.20
    breakout_min_close_above_prev_high_pct: 0.0
    # ARCHIVED/inactive (Point 3): superseded by volume_trigger.dry_up_max_ratio
    # + expansion_min_ratio below. Not read by _constructive_phase() and not
    # patch-eligible (see swing_tuning_patch_validator.py
    # _NON_TUNABLE_DOCUMENT_PATHS). Kept only for backward compatibility.
    breakout_min_volume_ratio: 1.20
    breakout_reclaim_vwap_min_pct: 0.0
    exhaustion_rsi_min: 72.0
    exhaustion_min_price_extension_pct: 8.0
    distribution_min_bandar_score: -4
    failed_max_drawdown_from_recent_high_pct: -7.0
    failed_breakdown_below_support_pct: -3.0
  # rs_policy_by_setup_family removed (Task HIGH-1, 2026-07-17): the 5/20-
  # session benchmark excess-return measurement is DIAGNOSTIC_UNVALIDATED and
  # no longer constrains ENTER/WATCH/AVOID. See
  # tasks/done/audit_signal_refactor_contract.md Task HIGH-1.
  requirements:
    accumulation:
      required_sequence: [ACCUMULATION, COMPRESSION, BREAKOUT_CONFIRMATION]
      enter_phases: [BREAKOUT_CONFIRMATION]
    breakout:
      required_sequence: [COMPRESSION, BREAKOUT_CONFIRMATION]
      enter_phases: [BREAKOUT_CONFIRMATION]
    pullback:
      required_sequence: []
      enter_phases: [BREAKOUT_CONFIRMATION]
      requires_reclaim_or_pivot: true
    confirmation:
      required_sequence: []
      enter_phases: []
      entry_authority: false
  volume_trigger:
    require_trusted_volume: true
    trusted_benchmark_volume_sources: ["stockbit", "idx"]
    min_valid_20d_sessions: 18
    zero_volume_tolerance: 1

    # Explicit dry-up/expansion evidence (Point 3, docs/signal_refactor.md
    # "primary SWING_10D trigger" pattern). Requires
    # dry_up_reference_sessions + 1 total candles: the latest session is a
    # standalone expansion candidate, dry_up_lookback_sessions sessions
    # immediately before it are the dry-up window, and the remaining
    # (dry_up_reference_sessions - dry_up_lookback_sessions) sessions before
    # that are the reference/baseline window (15 with these defaults).
    # dry-up ratio = avg(dry-up window) / avg(reference window).
    # expansion ratio = latest session volume / avg(dry-up window).
    # Both must confirm before the setup phase detector may claim a genuine
    # "dry-up then expansion" breakout trigger. Structural defaults, not
    # tuned from outcomes.
    dry_up_lookback_sessions: 5
    dry_up_reference_sessions: 20
    dry_up_max_ratio: 0.50

    expansion_min_ratio: 1.50
    expansion_requires_positive_close: true
