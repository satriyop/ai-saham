# Swing Setup Configuration
#
# Owns named swing setup gate policy only.
#
version: 1
name: "swing-setups"
description: |
  Deterministic named setup gates for swing workflows.
  Setup evaluation answers whether a candidate fits a setup; final action remains
  owned by SignalEngine + RiskEngine -> TradeSetup.

setups:
  foreign-bounce:
    enabled: true
    family: accumulation
    entry_authority: true
    can_enter_from_phases: [BREAKOUT_CONFIRMATION]
    # Reversal/absorption: foreigners are accumulating while price is still depressed.
    gates:
      min_foreign_flow_score: 58.3             # composite foreign-flow score gate (0-100 scale)
      min_vwap_discount_pct: 3.0 # foreigners must be underwater >= 3% below VWAP
      required_trend: SIDE       # pre-accumulation trend must be sideways
      min_flow_ratio_pct: 5.0    # foreign flow >= 5% of daily turnover over window
      max_rsi: 60                # not overbought; room to run
    partial_max_failed_gates: 2

  coiled-spring:
    enabled: true
    family: accumulation
    entry_authority: true
    can_enter_from_phases: [BREAKOUT_CONFIRMATION]
    # Breakout preparation: accumulation is present while volatility compresses.
    gates:
      min_foreign_flow_score: 50.0
      max_bb_width_pctile: 0.20
      min_flow_ratio_pct: 3.0
      max_rsi: 65
    partial_max_failed_gates: 2

  smart-money-confirmed:
    enabled: true
    family: confirmation
    entry_authority: false
    can_enter_from_phases: []
    # Quality filter: named-broker attribution confirms the accumulation.
    # No standalone entry authority — confirms flow quality but cannot alone
    # promote a candidate to ENTER (see DecisionPolicyService).
    gates:
      min_foreign_flow_score: 50.0
      min_smart_flow_idr: 0
      min_smart_share_pct: 30.0
      max_noise_share_pct: 60.0
      reject_smart_net_selling: true
    partial_max_failed_gates: 1

  pullback-continuation:
    enabled: true
    family: trend_continuation
    entry_authority: true
    can_enter_from_phases: [BREAKOUT_CONFIRMATION]
    # Trend-following: controlled pullback/accumulation inside an uptrend.
    gates:
      min_foreign_flow_score: 45.8
      required_trend: UP
      min_flow_ratio_pct: 2.0
      min_rsi: 40
      max_rsi: 65
      min_vwap_discount_pct: -2.0
    partial_max_failed_gates: 2

setup_phase:
  thresholds:
    # Rescaled 0-120 -> 0-100 (ADR-039) for consistency with foreign_flow_score.
    # NOTE: currently NOT read by SetupPhaseDetector's accumulation-phase gate
    # (_constructive_phase() uses passed_gates/flow_status instead) — kept as
    # a config value for potential future wiring, not an active behavior lever.
    accumulation_min_flow_score: 50.0
    accumulation_min_flow_ratio_pct: 2.0
    compression_max_bb_width_pctile: 0.20
    breakout_min_close_above_prev_high_pct: 0.0
    breakout_min_volume_ratio: 1.20
    breakout_reclaim_vwap_min_pct: 0.0
    exhaustion_rsi_min: 72.0
    exhaustion_min_price_extension_pct: 8.0
    distribution_min_bandar_score: -4
    failed_max_drawdown_from_recent_high_pct: -7.0
    failed_breakdown_below_support_pct: -3.0
  rs_policy_by_setup_family:
    foreign-bounce:
      lag_warning_below: -1.0
      hard_exclude_below: -4.0
      warning_max_decision: WATCH
      hard_exclude_max_decision: AVOID
      mean_reversion_exception_requires_support_reclaim: true
    accumulation:
      lag_warning_below: -1.0
      hard_exclude_below: -4.0
      warning_max_decision: WATCH
      hard_exclude_max_decision: AVOID
      mean_reversion_exception_requires_support_reclaim: true
    coiled-spring:
      lag_warning_below: -1.0
      hard_exclude_below: -4.0
      warning_max_decision: WATCH
      hard_exclude_max_decision: AVOID
      mean_reversion_exception_requires_support_reclaim: true
    breakout:
      lag_warning_below: -1.0
      hard_exclude_below: -4.0
      warning_max_decision: WATCH
      hard_exclude_max_decision: AVOID
      mean_reversion_exception_requires_support_reclaim: true
  volume_trigger:
    require_trusted_volume: true
    trusted_benchmark_volume_sources: ["stockbit", "idx"]
    min_valid_20d_sessions: 18
    zero_volume_tolerance: 1
