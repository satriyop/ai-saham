# Default configuration for ai-saham
#
# Impacted CLI Commands:
#   This file defines application-wide default parameters mapped to APP_CFG. It affects:
#   - saham screen accum / watchlist / compare
#   - saham today (reads analysis default universe and benchmark)
#   - saham fetch market / broker / universe
#   - saham indicator compute / snapshot / list / show / delete
#   - saham analyze risk / swing / swing-compare / compare / regime
#   - saham strategy backtest
#   - saham trade size / backtest-swing
#
# This file defines shipped defaults for the IDX market.
# Override any key in config/user.yaml (gitignored) — user.yaml wins key-by-key.
# Override individual options with CLI flags — flags beat everything.

# ── Market ────────────────────────────────────────────────────────────────
market:
  provider: stockbit     # primary candle source for stock tickers: stockbit | idx
                         # Enforces Stockbit as the sole source of candles for IDX
                         # stock tickers to guarantee correct exchange volumes.
                         # Requires a Stockbit browser profile (run 'saham fetch stockbit login').
  suffix: ".JK"         # ticker suffix for IDX symbols
  default_days: 365      # history depth for indicator/analyze commands
  idx_request_delay_seconds: 1.0   # min spacing between requests (rate-limit courtesy)
  idx_max_retries: 3               # attempts before giving up
  idx_retry_backoff_base: 2.0      # exponential back-off base in seconds (2s, 4s, 8s)

# ── Storage ───────────────────────────────────────────────────────────────
storage:
  db_path: "data/db/data.db"                         # SQLite path (relative to CWD, or absolute with ~)
  accum_journal: "journals/accumulation.csv"  # Accumulation screener results log
  trade_journal: "journals/trades.jsonl"     # Portfolio trade log (JSON Lines format)
  stockbit_profile_dir: ".stockbit_profile"   # Playwright browser profile directory
  stockbit_session_file: "stockbit_session.json"  # Session marker and credentials file
  intraday_sidecar: "data/session/.last-session.json"  # Last intraday session state sidecar
  intraday_confirmation: "data/session/.last-confirmation.json"  # Last intraday order confirmation temp file
  intraday_confirmation_journal: "journals/intraday_confirmations.csv"  # Intraday trades execution journal

# ── Config Paths ───────────────────────────────────────────────────────────
config_paths:
  pre_open_screener: "config/pre_open_screener.yaml"
  accumulation_screener: "config/accumulation_screener.yaml"
  accumulation_audit: "config/accumulation_audit.yaml"
  swing_setups: "config/swing_setups.yaml"
  swing_targets: "config/swing_targets.yaml"
  swing_backtest: "config/swing_backtest.yaml"
  analyze_swing: "config/analyze_swing.yaml"
  swing_risk_policy: "config/swing_risk_policy.yaml"
  risk_engine: "config/risk_engine.yaml"
  signal_engine: "config/signal_engine.yaml"
  market_context_engine: "config/market_context_engine.yaml"
  stockbit: "config/stockbit.yaml"
  company_quality_context: "config/company_quality_context.yaml"
  sector_context: "config/sector_context.yaml"
  ticker_profile: "config/ticker_profile.yaml"
  institutional_accumulation: "config/institutional_accumulation.yaml"
  universes: "config/universes.yaml"

# ── Broker ────────────────────────────────────────────────────────────────
broker:
  provider: idx          # broker summary source: idx (true daily totals, always)
                         # Stockbit tracked/institutional flow is layered on top
                         # automatically when a session is active — not a replacement.
  default_days: 30       # broker fetch look-back window (sessions)

# ── Analysis ──────────────────────────────────────────────────────────────
analysis:
  benchmark: "IHSG"      # canonical benchmark ticker for regime / return comparison
  universe: lq45         # default universe for daily briefings
  regime_universe: idx80 # universe used for market regime detection
  format: table          # output format: table | json

# ── Trading ───────────────────────────────────────────────────────────────
trading:
  capital: 100_000_000   # IDR — position sizing baseline (personal, override in user.yaml)

# ── Swing ─────────────────────────────────────────────────────────────────
swing:
  window: 7              # accumulation look-back (sessions)
  take_profit: 5.0       # TP % for backtest / audit exit grid
  stop_loss: 5.0         # SL %
  max_hold: 10           # max hold days before forced exit
  atr_mult: 1.5          # ATR multiplier for stop-loss placement
  rr: 2.0                # reward:risk ratio for take-profit calculation
  min_accum_score: 58.3        # composite foreign-flow score floor for screening (0-100 scale)
  capital: null          # IDR — personal capital, set in user.yaml; null disables position sizing
  risk_pct: 1.0          # % of capital at risk per trade

# ── Backtest ──────────────────────────────────────────────────────────────
backtest:
  start_date: "2026-01-01"  # default audit / backtest start date
  cost_bps: 20.0            # transaction cost in basis points (buy + sell combined)

# ── Fetch (write / refresh policy) ───────────────────────────────────────
fetch:
  default_days: 365         # matches analysis window; use --days 30 for a quick daily refresh
  start_tolerance_days: 7   # acceptable gap at start of a cached date range

# ── AI ────────────────────────────────────────────────────────────────────
ai:
  enabled: false         # AI-assisted analysis is OFF by default
  provider: deepseek     # default provider: deepseek | claude | openai | gemini | ollama
