# Signal Engine Configuration — confidence-aware staged-evidence aggregator
#
# Canonical scoring path: AssessSignalEvidenceUseCase
#   Stage 1: Group scoring — Setup Quality (60%) + Flow Confirmation (40%)
#   Stage 2: [ARCHIVED DIAGNOSTIC] Regime conditioning — output stored as legacy_conditioned_score
#            only; does NOT affect canonical assessment.score (resolved double-regime effect).
#            decision_policy is the canonical regime gate. DO NOT tune regime_conditioning.*.
#   Stage 3: Renormalize — missing groups excluded from denominator
#   Stage 4: Do-no-harm flags — score penalties from SignalContext
#   Stage 5: Directional score classification — maps canonical score to preliminary strength/action
#   Stage 6: Gate tightening — ENTER → WATCH cap when MarketContext.gate_tightening=True
#   Stage 7: Decision policy — explicit regime/setup max_decision constraints
#
# PRODUCTION / CANONICAL EVIDENCE ENGINE tuning surface:
#   evidence_groups.*.weight
#   flags.*.score_penalty
#   alpha_trigger.*
#   decision_policy.* authority-coverage, readiness, regime, and setup constraints
#   classification.* directional score thresholds
#   scoring.bandar.* (still active — controls bandar_max_range helper)
#
# REMOVED (non-operational, RETIRE-LEGACY-SIX-FACTOR-BASELINE Slice 2 findings
# fix): scoring.seasonality.*, scoring.analyst.*, scoring.forward_pe.* were
# never read by any production or diagnostic YAML path — the diagnostic
# company-quality producer (CompanyQualityContextEvidenceBuilder) is
# constructed with typed SignalScoringConfig() defaults, not YAML-resolved
# scoring. These keys are rejected explicitly by the resolver if present.
#
# DO NOT tune regime_conditioning.* (legacy/transitional — see Stage 2 note above)
#
# See ADR-024 for full configurability contract.
#
version: 1
signal_engine:

  # Final SignalAssessment classification. TradeSetup consumes the resulting
  # ENTER/WATCH/AVOID action after RiskEngine gates are applied.
  classification:
    strong_min_score: 70
    moderate_min_score: 45

  # Long-only pre-open directional champion (baseline v2 continuous ranking).
  # Auction quality caps the action; it never contributes directional points.
  pre_open_directional_baseline:
    contract: pre_open_directional_baseline.v2
    buy_pressure_min: 0.60
    sell_pressure_max: 0.40
    high_confidence_build_min: 0.08
    medium_confidence_floor: -0.03
    intensity_high_soft: 0.02
    reliable_spread_max_pct: 1.0
    max_spread_pct: 1.5
    large_gap_caution_pct: 5.0
    rsi_extension_threshold: 75.0
    # Continuous score (0-100): anchors + weights on pressure/delta/intensity.
    anchor_bullish: 58.0
    anchor_neutral: 45.0
    anchor_conflicted: 35.0
    anchor_bearish: 22.0
    weight_pressure: 18.0
    weight_delta: 22.0
    weight_intensity: 12.0
    intensity_scale: 0.02
    delta_clamp: 0.35
    # Pre-open entry cutovers on the continuous scale (not accum classification).
    enter_min_score: 62.0
    watch_min_score: 48.0

  # Provider lookbacks used by SignalEngine self-fetch mode.
  enrichment:
    insider_lookback_days: 90

  # Maps upstream workflow evidence into SignalContext fields.
  input_mapping:
    accum_score:
      # Rescaled 0-120 -> 0-100 in lockstep with score_accum_use_case.py's
      # AccumScorePolicy.max_score (see ADR-039). This is the divisor used
      # to normalize accum_score into SignalContext.foreign_flow_quality.
      max_score: 100.0
      clamp: true

  # Scoring helpers.
  #   scoring.bandar.*: ACTIVE — used by SignalEngine.bandar_max_range() to
  #     compute the dynamic score ceiling for bandar broad_score.
  #   scoring.seasonality/analyst/forward_pe were REMOVED (non-operational —
  #     no producer ever read them; CompanyQualityContextEvidenceBuilder uses
  #     typed SignalScoringConfig() defaults). Do not re-add them here; the
  #     resolver rejects them explicitly if present.
  scoring:
    bandar:
      mandatory_signal_count: 3
      signal_score_unit: 2
      default_max_range: 6

  # PRODUCTION / CANONICAL EVIDENCE ENGINE.
  # The production evidence basis for AssessSignalEvidenceUseCase (canonical
  # staged-evidence path). ADR-067 retired `setup_quality`: it was present in 0
  # of 7,764 accum window-observations, so its declared weight changed no value
  # the screen produced. `flow_confirmation` is now the sole production group —
  # the signal score IS the flow group score, with no blend and no
  # renormalization. `weight` is retained because it is the declared production
  # basis (ADR-059 policy snapshot material), not because it is divided by
  # anything. The resolver rejects a re-added `setup_quality` key.
  evidence_groups:
    flow_confirmation:
      weight: 0.40
      # Central authority status lives only in alpha_trigger.evidence_registrations
      # (HIGH-2) — this key just points at the registration name.
      authority_registration: institutional_flow
      required_for_authority: true

  # PRODUCTION / CANONICAL EVIDENCE ENGINE.
  # Diagnostic Alpha/Trigger projection. This is derived from the
  # canonical evidence groups, not a second factor tree. Runtime
  # flow_confirmation evidence maps into the institutional_flow slot;
  # sector_context (fed by SectorContextEvidence — sector-relative
  # diagnostics, NOT the market-wide MarketContext) and
  # company_quality_context are real configured slots that start unavailable /
  # DIAGNOSTIC until producers are promoted.
  #
  # ADR-067 retired the `setup_quality` *evidence group*; the Alpha/Trigger
  # slot of the same name is a distinct diagnostic projection and survives.
  # Its registration is no longer declared here (ADR-067 removed the
  # evidence_registrations entry) and resolves from the typed
  # AlphaTriggerConfig default (PRODUCTION), which is what it declared before.
  #
  # ─── READ THIS BEFORE CHANGING group_weights ─────────────────────────────
  # Three of the four slots below are configured but NEVER present. Measured
  # over the frozen ACCUM cohort (3,375 window-observations):
  #
  #   setup_quality             0/3375   weight 0.35   status PRODUCTION (default)
  #   institutional_flow     3375/3375   weight 0.30   status PRODUCTION
  #   sector_context            0/3375   weight 0.25   status DIAGNOSTIC
  #   company_quality_context   0/3375   weight 0.10   status DIAGNOSTIC
  #
  # Two conclusions look obvious here and are both WRONG. They were each
  # attempted, measured against the real aggregator, and withdrawn — see
  # tasks/backlog/NEXT_IDENTITY_BATCH.md (IB-1, IB-1b).
  #
  #  1. "setup_quality is PRODUCTION but never present, so it holds production
  #     weight hostage and nulls the trigger leg." It does not. An absent group
  #     takes an early branch in AlphaTriggerAggregator that hardcodes
  #     effective_weight=0.0 and skips the accumulators entirely, so its status
  #     is a recorded label only. Demoting it to DIAGNOSTIC changes no number.
  #     The trigger leg is null because it is phase-gated to
  #     BREAKOUT_CONFIRMATION, which a pre-breakout discovery screen rarely hits.
  #
  #  2. "The absent slots make coverage a useless constant 0.30, so delete
  #     them." Deleting them makes coverage a constant 1.00 instead — both terms
  #     of the ratio are fixed while one group fires. That swaps a true claim
  #     ("designed for four groups, running on one") for a false one ("fully
  #     covered"), and costs a purge + rebuild for zero variance gained.
  #
  # Keep these four weights as they are. The real change is to make a second
  # group actually present — IB-4, promoting sector_context /
  # company_quality_context, whose producers already exist and already emit.
  # That is governed by ADR-057 promotion guardrails; do not shortcut it by
  # flipping a status here.
  # ─────────────────────────────────────────────────────────────────────────
  alpha_trigger:
    enabled: true
    default_horizon: SWING_10D
    low_weight_cap: 0.10
    group_weights:
      setup_quality: 0.35
      institutional_flow: 0.30
      sector_context: 0.25
      company_quality_context: 0.10
    horizon_alpha_weights:
      TACTICAL_3D: 0.20
      SWING_10D: 0.40
      ACCUM_20D: 0.50
    route_fractions:
      TACTICAL_3D:
        setup_quality: {alpha_fraction: 0.00}
        institutional_flow: {alpha_fraction: 0.70}
        sector_context: {alpha_fraction: 0.25}
        company_quality_context: {alpha_fraction: 1.00}
      SWING_10D:
        setup_quality: {alpha_fraction: 0.00}
        institutional_flow: {alpha_fraction: 0.80}
        sector_context: {alpha_fraction: 0.60}
        company_quality_context: {alpha_fraction: 1.00}
      ACCUM_20D:
        setup_quality: {alpha_fraction: 0.10}
        institutional_flow: {alpha_fraction: 0.90}
        sector_context: {alpha_fraction: 0.75}
        company_quality_context: {alpha_fraction: 1.00}
    evidence_registrations:
      institutional_flow:
        status: PRODUCTION
      sector_context:
        status: DIAGNOSTIC
      company_quality_context:
        status: DIAGNOSTIC

  # PRODUCTION / CANONICAL EVIDENCE ENGINE.
  # Do-no-harm flags applied as score penalties.
  # Flags fire when the condition is met; penalty is subtracted from the group score.
  flags:
    valuation_stretched:
      enabled: true
      forward_pe_threshold: 50.0
      score_penalty: 10
    analyst_bearish:
      enabled: true
      buy_ratio_threshold: 0.20
      score_penalty: 8
    insider_selling:
      enabled: true
      net_buy_ratio_threshold: -0.30
      score_penalty: 12

  # Archived diagnostic legacy conditioning.
  # Output is stored as legacy_conditioned_score only — does NOT affect canonical
  # assessment.score. decision_policy is the canonical regime gate (Stage 7).
  # The double-regime effect is resolved: canonical score is regime-neutral.
  # DO NOT tune these values.
  # NEUTRAL:  weak flow confirmation (< threshold) discounted in legacy path.
  # VOLATILE: flow discounted unconditionally in legacy path.
  # gate_tightening: ENTER → WATCH cap is set per MarketContext via decision_policy.
  #
  # The whole RISK_OFF block (weak_setup_threshold / weak_setup_discount) and
  # volatile.setup_discount conditioned a setup group score. ADR-067 retired
  # setup_quality as an evidence group and deleted the two-name blend, so those
  # discounts could reach neither assessment.score nor legacy_conditioned_score.
  # They are now removed from config AND from the typed dataclasses and the
  # conditioning branches — flow is the only group this stage conditions.
  regime_conditioning:
    neutral:
      weak_flow_threshold: 50.0     # flow scores below this are discounted
      weak_flow_discount: 0.80      # ×0.80 (20% haircut)
    volatile:
      flow_discount: 0.80           # ×0.80 applied to all flow in volatile regime

  # PRODUCTION / CANONICAL EVIDENCE ENGINE.
  # Explicit regime eligibility policy (decision_policy). This caps final signal
  # entry_quality and emits decision_constraints; it does not mutate raw score.
  decision_policy:
    regime_policy:
      RISK_ON:
        enter_allowed: true
        enter_threshold: 70
        watch_threshold: 45
        min_signal_authority_coverage: 0.70
        max_decision: ENTER
        regime_size_multiplier: 1.00

      NEUTRAL:
        enter_allowed: true
        enter_threshold: 72
        watch_threshold: 45
        min_signal_authority_coverage: 0.70
        max_decision: ENTER
        regime_size_multiplier: 0.50

      RISK_OFF:
        enter_allowed: false
        enter_threshold: null
        watch_threshold: 60
        min_signal_authority_coverage: 0.80
        max_decision: WATCH
        regime_size_multiplier: 0.25

      VOLATILE:
        enter_allowed: false
        enter_threshold: null
        watch_threshold: 65
        min_signal_authority_coverage: 1.00
        max_decision: WATCH
        regime_size_multiplier: 0.00

    setup_regime_policy:
      foreign_bounce:
        RISK_ON: allowed
        NEUTRAL: restricted_or_watch_only
        RISK_OFF: allowed_if_flow_confirmation_strong
        VOLATILE: enter_disabled

      coiled_spring:
        RISK_ON: allowed
        NEUTRAL: restricted_or_watch_only
        RISK_OFF: enter_disabled
        VOLATILE: enter_disabled

      smart_money_confirmed:
        RISK_ON: allowed
        NEUTRAL: restricted_or_watch_only
        RISK_OFF: enter_disabled
        VOLATILE: enter_disabled

      pullback_continuation:
        RISK_ON: allowed
        NEUTRAL: restricted_or_watch_only
        RISK_OFF: enter_disabled
        VOLATILE: enter_disabled

    setup_regime_actions:
      allowed:
        max_decision: ENTER
      restricted_or_watch_only:
        max_decision: WATCH
      enter_disabled:
        max_decision: WATCH
      allowed_if_flow_confirmation_strong:
        max_decision: ENTER
