# Signal Engine Configuration — Phase 6 (confidence-aware evidence aggregator)
#
# Canonical scoring path: AssessSignalEvidenceUseCase
#   Stage 1: Group scoring — Setup Quality (60%) + Flow Confirmation (40%)
#   Stage 2: Regime conditioning — applied BEFORE renormalization (see regime_conditioning)
#   Stage 3: Renormalize — missing groups excluded from denominator
#   Stage 4: Do-no-harm flags — score penalties from SignalContext
#   Stage 5: Confidence-aware entry classification — ENTER requires score + confidence
#   Stage 6: Gate tightening — ENTER → WATCH cap when MarketContext.gate_tightening=True
#
# Tune: evidence_groups.*.weight, flags.*.score_penalty, regime_conditioning.*
#       classification.* score and confidence thresholds
#       scoring.bandar.* (still active — controls bandar_max_range helper)
#
# See ADR-024 for full configurability contract.
#
version: 1
signal_engine:

  # Final SignalAssessment classification. TradeSetup consumes the resulting
  # ENTER/WATCH/AVOID action after RiskEngine gates are applied.
  classification:
    strong_min_score: 70
    moderate_min_score: 45
    enter_min_confidence: 0.70
    watch_min_confidence: 0.40

  # [ARCHIVED — Phase 4] Missing-data neutral fill is no longer used.
  # Phase 4 excludes missing groups from the denominator instead of filling neutral.
  # Kept so AssessSignalUseCase (baseline reference) still loads without error.
  missing_data:
    neutral_score: 50.0
    coverage_warning_missing_factors: 3

  # Provider lookbacks used by SignalEngine self-fetch mode.
  enrichment:
    insider_lookback_days: 90

  # Maps upstream workflow evidence into SignalContext fields.
  input_mapping:
    foreign_flow_score:
      max_score: 120.0
      clamp: true

  # Scoring helpers.
  #   scoring.bandar.*: ACTIVE — used by SignalEngine.bandar_max_range() to
  #     compute the dynamic score ceiling for bandar broad_score.
  #   scoring.seasonality/analyst/forward_pe: ARCHIVED — used only by the
  #     retired AssessSignalUseCase flat-factor path, not by Phase 4 aggregator.
  scoring:
    bandar:
      mandatory_signal_count: 3
      signal_score_unit: 2
      default_max_range: 6
    # ARCHIVED: seasonality, analyst, forward_pe scoring thresholds below are
    # read only by AssessSignalUseCase (baseline reference). Phase 4 uses flags
    # for analyst/valuation signals and SetupEvidence for timing structure.
    seasonality:
      tailwind_min_avg_return_pct: 0.0
      tailwind_min_win_rate_pct: 50.0
      headwind_max_avg_return_pct: 0.0
      headwind_max_win_rate_pct: 50.0
    analyst:
      buy_score_max_points: 60.0
      upside_score_max_points: 40.0
      upside_cap_pct: 30.0
    forward_pe:
      very_cheap_pe: 10.0
      cheap_pe: 15.0
      fair_pe: 20.0
      expensive_pe: 30.0
      very_cheap_score: 95.0
      cheap_score: 75.0
      fair_score: 50.0
      expensive_score: 25.0
      post_expensive_pe_step: 10.0
      post_expensive_score_decay: 15.0

  # ARCHIVED: flat six-factor weights used by AssessSignalUseCase (baseline
  # reference only). Not read by Phase 4 AssessSignalEvidenceUseCase.
  # Do not tune these — tune evidence_groups and flags below instead.
  factors:
    bandar_intensity:
      enabled: true
      weight: 0.20
    foreign_flow_quality:
      enabled: true
      weight: 0.20
    insider_activity:
      enabled: true
      weight: 0.20
    seasonality_edge:
      enabled: true
      weight: 0.15
    analyst_consensus:
      enabled: true
      weight: 0.15
    forward_valuation:
      enabled: true
      weight: 0.10

  # Evidence-group weights for AssessSignalEvidenceUseCase (canonical Phase 4 path).
  # Weights are relative — renormalized when a group is missing (never neutral-filled).
  evidence_groups:
    setup_quality:
      weight: 0.60
    flow_confirmation:
      weight: 0.40

  # Phase 4: Do-no-harm flags applied as score penalties.
  # Flags fire when the condition is met; penalty is subtracted from the group score.
  flags:
    valuation_stretched:
      enabled: true
      forward_pe_threshold: 50.0
      score_penalty: 10
    analyst_bearish:
      enabled: true
      buy_ratio_threshold: 0.20
      score_penalty: 8
    insider_selling:
      enabled: true
      net_buy_ratio_threshold: -0.30
      score_penalty: 12

  # Phase 5: Regime-conditional group score conditioning applied BEFORE renormalization.
  # RISK_ON:  no conditioning — full confidence in evidence.
  # NEUTRAL:  weak flow confirmation (< threshold) discounted.
  # RISK_OFF: weak setup evidence (< threshold = PARTIAL or NO_MATCH) heavily discounted.
  # VOLATILE: both groups discounted regardless of score level.
  # gate_tightening: ENTER → WATCH cap is set per MarketContext, not here.
  regime_conditioning:
    neutral:
      weak_flow_threshold: 50.0     # flow scores below this are discounted
      weak_flow_discount: 0.80      # ×0.80 (20% haircut)
    risk_off:
      weak_setup_threshold: 60.0    # setup scores below this (PARTIAL/NO_MATCH range)
      weak_setup_discount: 0.50     # ×0.50 (50% haircut — market needs MATCH quality)
    volatile:
      setup_discount: 0.70          # ×0.70 applied to all setups in volatile regime
      flow_discount: 0.80           # ×0.80 applied to all flow in volatile regime
