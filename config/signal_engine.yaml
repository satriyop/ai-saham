# Signal Engine Configuration — confidence-aware staged-evidence aggregator
#
# Canonical scoring path: AssessSignalEvidenceUseCase
#   Stage 1: Group scoring — Setup Quality (60%) + Flow Confirmation (40%)
#   Stage 2: [ARCHIVED DIAGNOSTIC] Regime conditioning — output stored as legacy_conditioned_score
#            only; does NOT affect canonical assessment.score (resolved double-regime effect).
#            decision_policy is the canonical regime gate. DO NOT tune regime_conditioning.*.
#   Stage 3: Renormalize — missing groups excluded from denominator
#   Stage 4: Do-no-harm flags — score penalties from SignalContext
#   Stage 5: Directional score classification — maps canonical score to preliminary strength/action
#   Stage 6: Gate tightening — ENTER → WATCH cap when MarketContext.gate_tightening=True
#   Stage 7: Decision policy — explicit regime/setup max_decision constraints
#
# PRODUCTION / CANONICAL EVIDENCE ENGINE tuning surface:
#   evidence_groups.*.weight
#   flags.*.score_penalty
#   alpha_trigger.*
#   decision_policy.* authority-coverage, readiness, regime, and setup constraints
#   classification.* directional score thresholds
#   scoring.bandar.* (still active — controls bandar_max_range helper)
#
# REMOVED (non-operational, RETIRE-LEGACY-SIX-FACTOR-BASELINE Slice 2 findings
# fix): scoring.seasonality.*, scoring.analyst.*, scoring.forward_pe.* were
# never read by any production or diagnostic YAML path — the diagnostic
# company-quality producer (CompanyQualityContextEvidenceBuilder) is
# constructed with typed SignalScoringConfig() defaults, not YAML-resolved
# scoring. These keys are rejected explicitly by the resolver if present.
#
# DO NOT tune regime_conditioning.* (legacy/transitional — see Stage 2 note above)
#
# See ADR-024 for full configurability contract.
#
version: 1
signal_engine:

  # Final SignalAssessment classification. TradeSetup consumes the resulting
  # ENTER/WATCH/AVOID action after RiskEngine gates are applied.
  classification:
    strong_min_score: 70
    moderate_min_score: 45

  # Provider lookbacks used by SignalEngine self-fetch mode.
  enrichment:
    insider_lookback_days: 90

  # Maps upstream workflow evidence into SignalContext fields.
  input_mapping:
    accum_score:
      # Rescaled 0-120 -> 0-100 in lockstep with score_accum_use_case.py's
      # AccumScorePolicy.max_score (see ADR-039). This is the divisor used
      # to normalize accum_score into SignalContext.foreign_flow_quality.
      max_score: 100.0
      clamp: true

  # Scoring helpers.
  #   scoring.bandar.*: ACTIVE — used by SignalEngine.bandar_max_range() to
  #     compute the dynamic score ceiling for bandar broad_score.
  #   scoring.seasonality/analyst/forward_pe were REMOVED (non-operational —
  #     no producer ever read them; CompanyQualityContextEvidenceBuilder uses
  #     typed SignalScoringConfig() defaults). Do not re-add them here; the
  #     resolver rejects them explicitly if present.
  scoring:
    bandar:
      mandatory_signal_count: 3
      signal_score_unit: 2
      default_max_range: 6

  # PRODUCTION / CANONICAL EVIDENCE ENGINE.
  # Evidence-group weights for AssessSignalEvidenceUseCase (canonical staged-evidence path).
  # Weights are relative — renormalized when a group is missing (never neutral-filled).
  evidence_groups:
    setup_quality:
      weight: 0.60
      # Central authority status lives only in alpha_trigger.evidence_registrations
      # (HIGH-2) — this key just points at the registration name.
      authority_registration: setup_quality
      required_for_authority: true
    flow_confirmation:
      weight: 0.40
      authority_registration: institutional_flow
      required_for_authority: true

  # PRODUCTION / CANONICAL EVIDENCE ENGINE.
  # Diagnostic Alpha/Trigger projection. This is derived from the
  # canonical evidence groups, not a second factor tree. Existing runtime
  # setup_quality and flow_confirmation evidence map into the canonical
  # setup_quality and institutional_flow slots; sector_context (fed by
  # SectorContextEvidence — sector-relative diagnostics, NOT the market-wide
  # MarketContext) and company_quality_context are real configured slots that
  # start unavailable / DIAGNOSTIC until producers are promoted.
  alpha_trigger:
    enabled: true
    default_horizon: SWING_10D
    low_weight_cap: 0.10
    group_weights:
      setup_quality: 0.35
      institutional_flow: 0.30
      sector_context: 0.25
      company_quality_context: 0.10
    horizon_alpha_weights:
      TACTICAL_3D: 0.20
      SWING_10D: 0.40
      ACCUM_20D: 0.50
    route_fractions:
      TACTICAL_3D:
        setup_quality: {alpha_fraction: 0.00}
        institutional_flow: {alpha_fraction: 0.70}
        sector_context: {alpha_fraction: 0.25}
        company_quality_context: {alpha_fraction: 1.00}
      SWING_10D:
        setup_quality: {alpha_fraction: 0.00}
        institutional_flow: {alpha_fraction: 0.80}
        sector_context: {alpha_fraction: 0.60}
        company_quality_context: {alpha_fraction: 1.00}
      ACCUM_20D:
        setup_quality: {alpha_fraction: 0.10}
        institutional_flow: {alpha_fraction: 0.90}
        sector_context: {alpha_fraction: 0.75}
        company_quality_context: {alpha_fraction: 1.00}
    evidence_registrations:
      setup_quality:
        status: PRODUCTION
      institutional_flow:
        status: PRODUCTION
      sector_context:
        status: DIAGNOSTIC
      company_quality_context:
        status: DIAGNOSTIC

  # PRODUCTION / CANONICAL EVIDENCE ENGINE.
  # Do-no-harm flags applied as score penalties.
  # Flags fire when the condition is met; penalty is subtracted from the group score.
  flags:
    valuation_stretched:
      enabled: true
      forward_pe_threshold: 50.0
      score_penalty: 10
    analyst_bearish:
      enabled: true
      buy_ratio_threshold: 0.20
      score_penalty: 8
    insider_selling:
      enabled: true
      net_buy_ratio_threshold: -0.30
      score_penalty: 12

  # Archived diagnostic legacy conditioning.
  # Output is stored as legacy_conditioned_score only — does NOT affect canonical
  # assessment.score. decision_policy is the canonical regime gate (Stage 7).
  # The double-regime effect is resolved: canonical score is regime-neutral.
  # DO NOT tune these values. Removal pending explicit clean-break decision.
  # NEUTRAL:  weak flow confirmation (< threshold) discounted in legacy path.
  # RISK_OFF: weak setup evidence (< threshold) discounted in legacy path.
  # VOLATILE: both groups discounted in legacy path.
  # gate_tightening: ENTER → WATCH cap is set per MarketContext via decision_policy.
  regime_conditioning:
    neutral:
      weak_flow_threshold: 50.0     # flow scores below this are discounted
      weak_flow_discount: 0.80      # ×0.80 (20% haircut)
    risk_off:
      weak_setup_threshold: 60.0    # setup scores below this (PARTIAL/NO_MATCH range)
      weak_setup_discount: 0.50     # ×0.50 (50% haircut — market needs MATCH quality)
    volatile:
      setup_discount: 0.70          # ×0.70 applied to all setups in volatile regime
      flow_discount: 0.80           # ×0.80 applied to all flow in volatile regime

  # PRODUCTION / CANONICAL EVIDENCE ENGINE.
  # Explicit regime eligibility policy (decision_policy). This caps final signal
  # entry_quality and emits decision_constraints; it does not mutate raw score.
  decision_policy:
    regime_policy:
      RISK_ON:
        enter_allowed: true
        enter_threshold: 70
        watch_threshold: 45
        min_signal_authority_coverage: 0.70
        max_decision: ENTER
        regime_size_multiplier: 1.00

      NEUTRAL:
        enter_allowed: true
        enter_threshold: 72
        watch_threshold: 45
        min_signal_authority_coverage: 0.70
        max_decision: ENTER
        regime_size_multiplier: 0.50

      RISK_OFF:
        enter_allowed: false
        enter_threshold: null
        watch_threshold: 60
        min_signal_authority_coverage: 0.80
        max_decision: WATCH
        regime_size_multiplier: 0.25

      VOLATILE:
        enter_allowed: false
        enter_threshold: null
        watch_threshold: 65
        min_signal_authority_coverage: 1.00
        max_decision: WATCH
        regime_size_multiplier: 0.00

    setup_regime_policy:
      foreign_bounce:
        RISK_ON: allowed
        NEUTRAL: restricted_or_watch_only
        RISK_OFF: allowed_if_flow_confirmation_strong
        VOLATILE: enter_disabled

      coiled_spring:
        RISK_ON: allowed
        NEUTRAL: restricted_or_watch_only
        RISK_OFF: enter_disabled
        VOLATILE: enter_disabled

      smart_money_confirmed:
        RISK_ON: allowed
        NEUTRAL: restricted_or_watch_only
        RISK_OFF: enter_disabled
        VOLATILE: enter_disabled

      pullback_continuation:
        RISK_ON: allowed
        NEUTRAL: restricted_or_watch_only
        RISK_OFF: enter_disabled
        VOLATILE: enter_disabled

    setup_regime_actions:
      allowed:
        max_decision: ENTER
      restricted_or_watch_only:
        max_decision: WATCH
      enter_disabled:
        max_decision: WATCH
      allowed_if_flow_confirmation_strong:
        max_decision: ENTER
