# Signal Engine Configuration
#
# Controls which factors participate in the composite signal score and at what weight.
# Weights are renormalized automatically when factors are disabled — score stays 0–100.
#
# enabled: false  removes the factor from the active pool entirely (weight redistributes)
# enabled: false  ≠ weight: 0  (zero-weight keeps the factor in normalization math)
#
# See ADR-024 Engine Configurability Contract for full semantics.
#
version: 1
signal_engine:

  # Final SignalAssessment classification. TradeSetup consumes the resulting
  # ENTER/WATCH/AVOID action after RiskEngine gates are applied.
  classification:
    strong_min_score: 70
    moderate_min_score: 45

  # Missing enrichment is scored neutral, then surfaced as a coverage warning
  # once too many factors are absent.
  missing_data:
    neutral_score: 50.0
    coverage_warning_missing_factors: 3

  # Provider lookbacks used by SignalEngine self-fetch mode.
  enrichment:
    insider_lookback_days: 90

  # Maps upstream workflow evidence into SignalContext fields.
  input_mapping:
    foreign_flow_score:
      max_score: 120.0
      clamp: true

  # Factor-internal scoring thresholds. Factor weights below control influence;
  # this block controls how raw enrichment data maps to a 0-100 component score.
  scoring:
    bandar:
      mandatory_signal_count: 3
      signal_score_unit: 2
      default_max_range: 6
    seasonality:
      tailwind_min_avg_return_pct: 0.0
      tailwind_min_win_rate_pct: 50.0
      headwind_max_avg_return_pct: 0.0
      headwind_max_win_rate_pct: 50.0
    analyst:
      buy_score_max_points: 60.0
      upside_score_max_points: 40.0
      upside_cap_pct: 30.0
    forward_pe:
      very_cheap_pe: 10.0
      cheap_pe: 15.0
      fair_pe: 20.0
      expensive_pe: 30.0
      very_cheap_score: 95.0
      cheap_score: 75.0
      fair_score: 50.0
      expensive_score: 25.0
      post_expensive_pe_step: 10.0
      post_expensive_score_decay: 15.0

  factors:
    bandar_intensity:
      enabled: true
      weight: 0.20
    foreign_flow_quality:
      enabled: true
      weight: 0.20
    insider_activity:
      enabled: true
      weight: 0.20
    seasonality_edge:
      enabled: true
      weight: 0.15
    analyst_consensus:
      enabled: true
      weight: 0.15
    forward_valuation:
      enabled: true
      weight: 0.10

  # Phase 4: Evidence-group weights for AssessSignalEvidenceUseCase.
  # Weights are relative (renormalized when a group is missing).
  evidence_groups:
    setup_quality:
      weight: 0.60
    flow_confirmation:
      weight: 0.40

  # Phase 4: Do-no-harm flags applied as score penalties.
  # Flags fire when the condition is met; penalty is subtracted from the group score.
  flags:
    valuation_stretched:
      enabled: true
      forward_pe_threshold: 50.0
      score_penalty: 10
    analyst_bearish:
      enabled: true
      buy_ratio_threshold: 0.20
      score_penalty: 8
    insider_selling:
      enabled: true
      net_buy_ratio_threshold: -0.30
      score_penalty: 12
