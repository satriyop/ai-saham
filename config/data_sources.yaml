# Data source preferences for ai-saham
#
# Impacted CLI Commands:
#   - saham fetch market (uses candle_source fallback and idx rates configuration)
#   - saham fetch broker (uses broker_summary_source to select provider)
#   - saham fetch broker-history (uses broker summaries from configured sources)
#
# Controls which provider is used for each data type.
# This file is the single place to swap data sources — no code changes needed.
#
# Changing a value here takes effect on the next fetch run.

# ── Broker summaries ──────────────────────────────────────────────────────
#
# Which provider supplies broker_summaries (total_value, foreign flow aggregates).
# Both providers now return accurate total_value:
#   - idx:      IDX public API — no auth required, exchange-authoritative source
#   - stockbit: Stockbit Exodus API — requires active browser session
#               Uses /company-price-feed/historical/summary for true market turnover
#               (confirmed accurate: matches IDX exactly for BBCA 2026-06-17)
#
# Default: idx (no auth required, always available)
broker_summary_source: idx

# ── IDX public API client tuning ──────────────────────────────────────────
#
# Controls rate-limiting and retry behaviour for the IDX public API.
# Applies to both the broker-summary provider (idx.py) and the market
# candle provider (idx_market.py).
idx:
  request_delay_seconds: 1.0   # min spacing between requests (rate-limit courtesy)
  max_retries: 3               # attempts before giving up
  retry_backoff_base: 2.0      # exponential back-off base in seconds (2s, 4s, 8s)

# ── Candle data ───────────────────────────────────────────────────────────
#
# Which provider supplies OHLCV candle data.
#   - yahoo: Yahoo Finance — adjusted prices, global coverage, no auth
#   - idx:   IDX public API — unadjusted, Indonesia only
#
# Default: yahoo
candle_source: yahoo
