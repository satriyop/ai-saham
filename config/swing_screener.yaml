# Swing Screener Configuration
#
# Impacted CLI Commands:
#   - saham screen accum / saham screen swing (runs accumulation screening using parameters defined here)
#   - saham analyze swing / swing-compare (uses screen gates, BCI profiles, corporate actions, and preset targets)
#   - saham trade size (uses swing ATR multipliers / preset targets to size positions)
#   - saham trade backtest-swing (backtests swing strategies using preset targets and regime-adaptive TP/SL)
#
version: 1
name: "swing-screener"
description: |
  Swing trade accumulation screener policy for IDX stocks.
  Controls resistance gates, regime-adaptive TP/SL, dividend risk
  warnings, and sector breadth confirmation for the foreign-bounce
  and accumulation-based swing workflow.

  All thresholds are configurable here — adjust as IHSG volatility
  regime and tick-size regulation evolves.

screener:
  # Market cap floor in IDR. Tickers with market_cap_idr below this are excluded.
  # Set to 0 to disable. Example: 500_000_000_000 = 500B IDR (~mid-cap floor for IDX).
  # Requires fundamentals_provider (Stockbit keystats) to be active.
  min_market_cap_idr: 0

resistance:
  # Minimum % headroom between current price and nearest resistance
  # (MA200 or 52-week high) required to keep ENTER verdict.
  # If nearest resistance is closer than this, candidate is flagged
  # with resistance_flag=True and the CLI downgrades to WATCH.
  headroom_min_pct: 5.0

  # Which resistance levels to check. Both use existing candle data
  # (no new API calls).
  #   ma200      — 200-day SMA of close prices
  #   week52_high — 52-week (252 trading day) highest high
  levels:
    - ma200
    - week52_high

  # Set to false to disable the resistance gate entirely.
  resistance_gate_enabled: true

preset_targets:
  # Regime-adaptive TP/SL for the foreign-bounce preset.
  # Keys use MCE vocabulary (RISK_ON/NEUTRAL/VOLATILE/RISK_OFF).
  # Legacy keys (bullish/sideways/weak) kept for old sidecars and backcompat.
  # Validated direction: IHSG has documented regime cycles.
  # Exact thresholds are calibration starting points — adjust to your backtest.
  risk_on:
    take_profit_pct: 8.0
    stop_loss_pct: 4.0    # 2:1 R:R — trending market, let winners run

  neutral:
    take_profit_pct: 5.0
    stop_loss_pct: 5.0    # 1:1 R:R — range-bound, take what the market gives

  volatile:
    take_profit_pct: 3.0
    stop_loss_pct: 3.0    # Tight — minimize exposure in volatile conditions

  risk_off:
    take_profit_pct: 3.0
    stop_loss_pct: 3.0    # Capital preservation mode

  default:
    take_profit_pct: 5.0
    stop_loss_pct: 5.0    # Fallback when regime data is unavailable

  # Legacy labels — kept for backward compat with old sidecars
  bullish:
    take_profit_pct: 8.0
    stop_loss_pct: 4.0
  sideways:
    take_profit_pct: 5.0
    stop_loss_pct: 5.0
  weak:
    take_profit_pct: 3.0
    stop_loss_pct: 3.0

corporate_actions:
  # Primary: "stockbit" uses Playwright session to fetch ex-dates.
  # Fallback: "csv" reads the file at csv_path.
  # "disabled" turns off the filter entirely.
  source: "csv"

  # Path to CSV with corporate action data.
  # Columns: ticker,ex_date (YYYY-MM-DD)
  # If file does not exist, filter is silently skipped (graceful degradation).
  csv_path: "data/corporate_actions.csv"

  # Flag as DIVIDEND_RISK if ex-date falls within this many trading days.
  # Based on max hold period of swing strategy.
  ex_date_warning_days: 10

  enabled: true

sector_breadth:
  # If >= this fraction of sector peers show positive net_buy_ratio over
  # the screening window, apply a rotation bonus to all tickers in that sector.
  # Note: 60% threshold has no empirical backing — calibrate to your backtest.
  breadth_threshold: 0.60

  # Bonus points awarded when breadth threshold is met.
  # Also uncalibrated — tune after running backtests.
  bonus_pts: 10

  # Minimum tickers from the same idx_groups.yaml group that must appear
  # in the screened result set for breadth calculation to apply.
  # Below this count, sector_breadth_pct is None (insufficient sample).
  min_tickers_for_breadth: 3

  # Set to false to disable sector breadth bonus entirely.
  sector_breadth_enabled: true

broker_quality:
  # Smart-money foreign desks — weighted at smart_weight in flow analysis.
  # Update when institutional players enter or exit the Indonesian market.
  smart_money:
    brokers: [AK, BK, KZ, ZP, RX, MS, DB, ML, YU]
    weight: 1.5    # multiplier applied to their net flow in weighted score

  # Domestic retail noise brokers — weighted at noise_weight.
  noise:
    brokers: [YP, PD, XL, XC]
    weight: 0.5    # reduced weight: retail flow is less directionally predictive

  # Minimum % of weighted flow that must come from smart-money brokers
  # to classify broker context as "smart accumulation" quality.
  smart_share_threshold_pct: 60.0

  # Minimum % of total absolute tracked flow that smart-money net selling
  # must represent before the "smart-money selling conflicts" warning fires.
  # Prevents spurious warnings when smart brokers are minor sellers
  # (e.g. DB selling 2M while noise buys 100M → 2% share, no warning).
  smart_sell_min_share_pct: 15.0

  # Tier 1 foreign institutional desks used for BCI (Broker Concentration Index) scoring.
  # BCI CLUSTER (>= cluster_min_count desks in net-buyers window) = +15 score pts.
  # BCI STABLE  (>= stable_min_count desks)                       = +5 score pts.
  # BCI RETAIL-LED (0 desks)                                      = +0 score pts.
  # Overlaps with stockbit.yaml institutional_proxy but different membership —
  # purely foreign desks; domestic proxies like YP are excluded.
  tier1:
    brokers: [AK, BK, ZP, KZ, YU, RX, HD, CP, DR]
    cluster_min_count: 3
    stable_min_count: 1

regime:
  # Moving average periods for market breadth and benchmark trend signals.
  # breadth_sma_period: SMA window applied to the advance/decline ratio time-series.
  # benchmark_sma_fast/slow: dual-MA crossover on the benchmark (e.g. ^JKSE).
  breadth_sma_period: 20
  benchmark_sma_fast: 20
  benchmark_sma_slow: 50
  # Fraction of universe above SMA20 required to score a bull breadth point.
  # Applies to both price breadth and foreign-flow breadth signals.
  breadth_threshold_pct: 50

foreign_bounce:
  # Gate thresholds for the foreign-bounce preset ENTER/WATCH/AVOID classification.
  # A candidate must pass ALL gates for ENTER; partial pass = WATCH.
  gates:
    min_score: 70              # accumulation composite score gate (0–120 scale)
    min_vwap_discount_pct: 3.0 # foreigners must be underwater ≥ 3% below VWAP
    required_trend: SIDE       # pre-accumulation trend must be sideways (not trending up)
    min_flow_ratio_pct: 5.0    # foreign flow ≥ 5% of daily turnover over window
    max_rsi: 60                # not overbought — room to run

  # Maximum number of failed gates allowed before downgrading from WATCH to AVOID.
  # Also: if score ≥ min_score regardless of failed count → stays WATCH.
  watch_max_failed_gates: 2

verdicts:
  # Score thresholds for ENTER/WATCH classifications in the screener output table.
  # Also used to colour-code the score column (green ≥ enter, yellow ≥ watch).
  enter_min_score: 70
  watch_min_score: 40

  # Signal label thresholds shown in the per-ticker detail view.
  signals:
    strong_min_score: 70       # "strong" — high score + sustained streak
    strong_min_streak: 8
    building_min_score: 60     # "building" — decent score + medium streak
    building_min_streak: 5
    coiled_spring_bb_pctile: 0.20  # "coiled spring" — BB width in bottom 20th pctile
    coiled_spring_min_score: 60
