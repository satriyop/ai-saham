[project]
name = "ai-saham"
dynamic = ["version"]
description = "Local-first stock analysis CLI for Indonesia Stock Exchange (IDX)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "yfinance>=0.2.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0.0",
    "httpx>=0.26.0",
    "openai>=1.0.0",
    "defusedxml>=0.7.0",
    "rich>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]
browser = [
    "playwright>=1.40.0",
]
tui = [
    "textual>=8.2,<9",
]

[project.scripts]
saham = "src.adapters.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
