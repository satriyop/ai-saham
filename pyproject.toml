[project]
name = "ai-saham"
dynamic = ["version"]
description = "Local-first stock analysis CLI for Indonesia Stock Exchange (IDX)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "yfinance>=0.2.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0.0",
    "httpx>=0.26.0",
    "openai>=1.0.0",
    "defusedxml>=0.7.0",
    "rich>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]
browser = [
    "playwright>=1.40.0",
]
tui = [
    "textual>=8.2,<9",
]
research = [
    "polars>=1.0.0",
    "scikit-learn>=1.4.0",
    "statsmodels>=0.14.0",
]

[project.scripts]
saham = "src.adapters.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "agent: AI-agent feature tests across application, infrastructure, composition, and adapters. Feature ownership only: does not imply slow or live-network execution. Select with `-m agent`; fast slice with `-m 'agent and not tui'`.",
    "uses_live_refresh: opt out of the autouse CLI auto-refresh network stub; the test exercises the real refresh path",
    "tui: full-app Textual mount/drive test (~1.5-4.7s each; ~60% of suite wall time). Auto-applied under tests/adapters/tui to any test that uses `run_test`. Exclude the heavy slice with `-m 'not tui'`; force-include with the marker.",
    "tui_unit: force a tests/adapters/tui test OUT of the `tui` slice (a pure model/paint unit that never mounts the app); overrides the auto-tag.",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
